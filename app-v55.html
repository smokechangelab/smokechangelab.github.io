<!doctype html>
<html lang="de" data-release="20260912-v55.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Smoke Lab</title>
<style>
:root{--bg:#F2F4F7;--card:#fff;--ink:#1B4F4C;--text:#334155;--muted:#64748B;--accent:#E8873A;--line:#E2E8F0;--soft:#EEF4F1;--danger:#B4533C;--shadow:0 4px 16px rgba(0,0,0,.02);--r:20px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text)}body{display:flex;justify-content:center}.app{width:100%;max-width:414px;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.screen{display:none;height:100%;overflow-y:auto;padding:20px 16px calc(92px + env(safe-area-inset-bottom));gap:16px}.screen.active{display:flex;flex-direction:column}.head{display:flex;flex-direction:column;gap:4px}.kicker{font-size:11px;line-height:1.2;text-transform:uppercase;letter-spacing:.6px;font-weight:600;color:var(--muted)}h1{font-size:22px;line-height:1.08;font-weight:800;letter-spacing:-.5px;color:var(--ink)}h2{font-size:20px;line-height:1.12;font-weight:800;letter-spacing:-.5px;color:var(--ink)}.body{font-size:14px;line-height:1.45;color:var(--text)}.muted{font-size:13px;line-height:1.4;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#F8FAF9;border:1px solid var(--line);border-radius:14px;padding:14px}.metric strong{display:block;font-size:20px;line-height:1;color:var(--ink)}.metric span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}
.btn{height:56px;min-height:56px;width:100%;border-radius:16px;padding:0 16px;font-size:15px;font-weight:750;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer}.btn:active{transform:scale(.985)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(232,135,58,.20)}.btn.petrol{background:var(--ink);border-color:var(--ink);color:#fff}.btn.danger{color:var(--danger);border-color:#F0D6CE}.btn.small{height:44px;min-height:44px;border-radius:13px;font-size:13px}
.status{background:var(--ink);color:#fff}.status .kicker{color:rgba(255,255,255,.68)}.status h2{color:#fff}.badge{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.13);font-size:11px;font-weight:700;white-space:nowrap}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding:6px 4px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:50}.tab{border:0;background:transparent;color:var(--muted);border-radius:12px;font-size:9px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}.tab b{font-size:17px;line-height:1}.tab.active{color:var(--ink);background:#EAF0ED;font-weight:800}
.phase-list{display:grid;gap:8px}.phase{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:68px}.phase-num{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--ink)}.phase strong{font-size:13px;color:var(--ink)}.phase small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}.phase.active{border-color:#9FC0B5;background:#FBFEFC}
.progressbar{height:7px;border-radius:999px;background:#E8ECEA;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--ink);border-radius:inherit}.pattern-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pattern-item{min-height:92px}.pattern-item strong{display:block;font-size:13px;color:var(--ink)}.pattern-item span{display:block;margin-top:5px;font-size:12px;color:var(--muted);line-height:1.35}.chart{height:110px;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;padding-top:8px}.barwrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}.bar{width:100%;max-width:30px;min-height:8px;border-radius:8px 8px 4px 4px;background:#BFD2C9}.bar.today{background:var(--ink)}.barwrap small{font-size:9px;color:var(--muted)}
.setting{padding:13px 0;border-top:1px solid var(--line)}.setting:first-child{border-top:0}.setting strong{font-size:14px;color:var(--ink)}.setting small{display:block;margin-top:3px;font-size:11px;color:var(--muted)}.input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:#FAFAFC;padding:0 14px;font-size:15px;color:var(--ink);outline:none}.input:focus{border-color:#91AAA1;background:#fff}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button,.trigger{height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}.seg button.active,.trigger.active{background:var(--ink);border-color:var(--ink);color:#fff}.trigger-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slider{width:100%;accent-color:var(--ink)}.sliderlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.34);backdrop-filter:blur(5px);display:none;z-index:100}.backdrop.open{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;z-index:110;background:#fff;border-radius:28px 28px 0 0;border:1px solid var(--line);box-shadow:0 -16px 44px rgba(0,0,0,.16);padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:86dvh;overflow:auto}.sheet.open{transform:translateY(0)}.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.close{width:34px;height:34px;border:0;border-radius:50%;background:#EEF2F1;color:var(--ink);font-size:20px}.sheet .stack{gap:14px}.sheet-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:4px}.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}.successmark{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);font-size:25px;font-weight:900}
.onboarding{position:absolute;inset:0;background:var(--bg);z-index:200;display:none;overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}.onboarding.open{display:flex;flex-direction:column;gap:16px}.onboarding .brand{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.04em}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.goal{height:54px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:13px;font-weight:700}.goal.active{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:370px){.screen{padding-left:12px;padding-right:12px}.card{padding:16px}.btn{font-size:14px}.tab{font-size:8px}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="screen active" id="today"></section>
  <section class="screen" id="lab"></section>
  <section class="screen" id="patterns"></section>
  <section class="screen" id="progress"></section>
  <section class="screen" id="me"></section>
  <nav class="nav" aria-label="Hauptnavigation">
    <button class="tab active" data-tab="today"><b>⌂</b><span>HEUTE</span></button>
    <button class="tab" data-tab="lab"><b>◫</b><span>LABOR</span></button>
    <button class="tab" data-tab="patterns"><b>⌁</b><span>MUSTER</span></button>
    <button class="tab" data-tab="progress"><b>↗</b><span>FORTSCHRITT</span></button>
    <button class="tab" data-tab="me"><b>○</b><span>ICH</span></button>
  </nav>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet"></div>
  <div class="onboarding" id="onboarding"></div>
</div>
<script>
const KEY='smokeLab.v55';
const TRIGGERS=['Stress','Kaffee','Gewohnheit','Pause','Nach dem Essen','Gesellschaft'];
const PHASES=[['Beobachten','Muster sichtbar machen'],['Unterbrechen','Autopilot stören'],['Entkoppeln','Trigger lösen'],['Ersetzen','Neue Antworten testen'],['Stabilisieren','Kontrolle festigen']];
const fresh=()=>({startedAt:Date.now(),name:'',baseline:10,packPrice:null,goal:'quit',events:[],activeTab:'today',onboardingCompleted:false});
let S=load(); let draft={type:'smoke',trigger:'Stress',intensity:3};
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(){return Math.max(1,Math.min(30,Math.floor((Date.now()-S.startedAt)/86400000)+1))}
function phase(){return Math.min(4,Math.floor((day()-1)/6))}
function todays(){const d=new Date().toDateString();return S.events.filter(e=>new Date(e.ts).toDateString()===d)}
function smokesToday(){return todays().filter(e=>e.type==='smoke').length}
function resistsToday(){return todays().filter(e=>e.type==='resist').length}
function controlScore(){const a=S.events.slice(-20);if(!a.length)return 50;return Math.round(a.reduce((n,e)=>n+(e.type==='resist'?100:Math.max(20,80-(e.intensity||3)*10)),0)/a.length)}
function topTrigger(){const c={};S.events.forEach(e=>{if(e.trigger)c[e.trigger]=(c[e.trigger]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Noch nicht belastbar'}
function avgIntensity(){const a=todays().filter(e=>e.intensity);return a.length?(a.reduce((n,e)=>n+e.intensity,0)/a.length).toFixed(1):'–'}
function moneyToday(){if(!S.packPrice||!S.baseline)return null;const saved=Math.max(0,S.baseline-smokesToday());return (saved*(S.packPrice/20)).toFixed(2).replace('.',',')}
function render(){renderToday();renderLab();renderPatterns();renderProgress();renderMe();document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===S.activeTab));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===S.activeTab));if(!S.onboardingCompleted)renderOnboarding()}
function renderToday(){const m=moneyToday();today.innerHTML=`<div class="head"><div class="kicker">HEUTE · TAG ${day()}</div><h1>${greeting()}${S.name?`, ${esc(S.name)}`:''}</h1><div class="muted">Den nächsten automatischen Moment sichtbar machen.</div></div><div class="card status"><div class="row"><div><div class="kicker">PHASE ${phase()+1}</div><h2>${PHASES[phase()][0]}</h2></div><span class="badge">${controlScore()}/100</span></div><div class="muted" style="color:rgba(255,255,255,.76)">${PHASES[phase()][1]}${m?` · heute ca. ${m} € weniger`:''}</div></div><div class="stack"><button class="btn primary" data-open-log>+ Zigarette / Widerstand erfassen</button><button class="btn" data-open-sos>⚡ Drang stoppen (SOS)</button></div><div class="card stack"><div><div class="kicker">TAGES-RADAR</div><h2 style="font-size:16px;margin-top:3px">Heute auf einen Blick</h2></div><div class="grid2"><div class="metric"><strong>${smokesToday()}</strong><span>Zigaretten</span></div><div class="metric"><strong>${resistsToday()}</strong><span>Unterbrechungen</span></div></div><div class="row"><span class="muted">Muster</span><strong style="font-size:13px;color:var(--ink)">${esc(topTrigger())}</strong></div><div class="row"><span class="muted">Nächster Schritt</span><strong style="font-size:13px;color:var(--ink)">${smokesToday()?'Nächsten Automatismus unterbrechen':'Beim nächsten Drang SOS testen'}</strong></div></div>`}
function renderLab(){lab.innerHTML=`<div class="head"><div class="kicker">LABOR · 30-TAGE-PROGRAMM</div><h1>Trainiere Kontrolle.</h1><div class="muted">Fünf kompakte Phasen, ein klares Ziel.</div></div><div class="phase-list">${PHASES.map((p,i)=>`<div class="card phase ${i===phase()?'active':''}"><div class="phase-num">${i+1}</div><div><strong>${p[0]}</strong><small>${p[1]}</small></div><span class="pill">Tage ${i*6+1}–${i*6+6}</span></div>`).join('')}</div><div class="card stack"><div class="kicker">AKTUELLES EXPERIMENT</div><h2 style="font-size:16px">${['Beobachte einen automatischen Moment','3-Minuten-Verzögerung','Kaffee ohne Zigarette koppeln','Nach-dem-Essen-Reset','Erste Zigarette bewusst verschieben'][phase()]}</h2><div class="body">Nicht perfekt ausführen. Nur testen, was dir tatsächlich mehr Wahlmöglichkeit gibt.</div></div>`}
function renderPatterns(){const n=S.events.length,ready=n>=8;patterns.innerHTML=`<div class="head"><div class="kicker">MUSTER</div><h1>Dein Rauchmuster.</h1><div class="muted">Erst ab 8 Situationen zeigen wir belastbare Muster.</div></div><div class="card stack"><div class="row"><strong style="color:var(--ink)">${Math.min(n,8)}/8 Situationen</strong><span class="pill">${ready?'bereit':'Kalibrierung'}</span></div><div class="progressbar"><span style="width:${Math.min(100,n/8*100)}%"></span></div>${ready?patternHTML():`<div class="pattern-grid"><div class="card pattern-item"><strong>Top-Trigger</strong><span>Noch nicht belastbar</span></div><div class="card pattern-item"><strong>Intensität</strong><span>Noch nicht belastbar</span></div><div class="card pattern-item"><strong>Kontext</strong><span>Noch nicht belastbar</span></div><div class="card pattern-item"><strong>Risikozeit</strong><span>Noch nicht belastbar</span></div></div>`}</div>`}
function patternHTML(){const sm=S.events.filter(e=>e.type==='smoke').length,re=S.events.filter(e=>e.type==='resist').length;return `<div class="pattern-grid"><div class="card pattern-item"><strong>Top-Trigger</strong><span>${esc(topTrigger())}</span></div><div class="card pattern-item"><strong>Ø Intensität</strong><span>${allAvgIntensity()}</span></div><div class="card pattern-item"><strong>Geraucht</strong><span>${sm} Situationen</span></div><div class="card pattern-item"><strong>Unterbrochen</strong><span>${re} Situationen</span></div></div>`}
function allAvgIntensity(){const a=S.events.filter(e=>e.intensity);return a.length?(a.reduce((n,e)=>n+e.intensity,0)/a.length).toFixed(1):'–'}
function renderProgress(){const vals=last7();progress.innerHTML=`<div class="head"><div class="kicker">FORTSCHRITT</div><h1>Kontrolle statt Erfolgsserien.</h1><div class="muted">Fortschritt heißt mehr Wahlmöglichkeit, nicht perfekte Tage.</div></div><div class="card stack"><div class="row"><div><div class="kicker">KONTROLLWERT</div><div style="font-size:42px;line-height:1;font-weight:800;color:var(--ink);margin-top:5px">${controlScore()}</div></div><span class="pill">Referenz: ${S.baseline}/Tag</span></div></div><div class="grid2"><div class="card metric"><strong>${S.events.filter(e=>e.type==='resist').length}</strong><span>Unterbrechungen</span></div><div class="card metric"><strong>${S.events.filter(e=>e.type==='smoke').length}</strong><span>Erfasst</span></div><div class="card metric"><strong>${avgIntensity()}</strong><span>Ø Intensität heute</span></div><div class="card metric"><strong>${S.baseline}</strong><span>Ausgangswert / Tag</span></div></div><div class="card stack"><div class="row"><div class="kicker">7-TAGE-TREND</div><span class="muted">Situationen</span></div><div class="chart">${vals.map((v,i)=>`<div class="barwrap"><div class="bar ${i===6?'today':''}" style="height:${Math.max(8,Math.min(78,v*10))}px"></div><small>${i===6?'Heute':6-i+'T'}</small></div>`).join('')}</div></div>`}
function last7(){return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const s=d.toDateString();return S.events.filter(e=>new Date(e.ts).toDateString()===s).length})}
function renderMe(){me.innerHTML=`<div class="head"><div class="kicker">ICH</div><h1>Deine Einstellungen.</h1><div class="muted">Lokal gespeichert. Kein Konto nötig.</div></div><div class="card"><div class="setting"><strong>Name</strong><small>${esc(S.name||'Nicht gesetzt')}</small></div><div class="setting"><strong>Ziel</strong><small>${S.goal==='quit'?'Aufhören':'Reduzieren'}</small></div><div class="setting"><strong>Ausgangswert</strong><small>${S.baseline} Zigaretten / Tag</small></div><div class="setting"><strong>Daten</strong><small>${S.events.length} Situationen lokal gespeichert</small></div></div><button class="btn" data-edit-profile>Einstellungen bearbeiten</button><button class="btn danger" data-reset>Lokale Daten zurücksetzen</button>`}
function greeting(){const h=new Date().getHours();return h<11?'Guten Morgen':h>17?'Guten Abend':'Guten Tag'}
function openSheet(html){sheet.innerHTML=html;backdrop.classList.add('open');sheet.classList.add('open')}
function closeSheet(){backdrop.classList.remove('open');sheet.classList.remove('open');setTimeout(()=>sheet.innerHTML='',280)}
function openLog(){draft={type:'smoke',trigger:'Stress',intensity:3};openSheet(`<div class="sheethead"><div><div class="kicker">ERFASSEN</div><h2>Zigarette / Widerstand</h2></div><button class="close" data-close>×</button></div><div class="stack"><div><div class="kicker" style="margin-bottom:7px">WAS IST PASSIERT?</div><div class="seg"><button class="active" data-kind="smoke">Geraucht</button><button data-kind="resist">Widerstanden</button></div></div><div><div class="kicker" style="margin-bottom:7px">AUSLÖSER</div><div class="trigger-grid">${TRIGGERS.map((t,i)=>`<button class="trigger ${i===0?'active':''}" data-trigger="${t}">${t}</button>`).join('')}</div></div><div><div class="row" style="margin-bottom:8px"><div class="kicker">STÄRKE</div><strong id="intensityValue" style="color:var(--ink)">3 / 5</strong></div><input class="slider" id="intensity" type="range" min="1" max="5" value="3"><div class="sliderlabels"><span>leicht</span><span>stark</span></div></div><div class="sheet-actions"><button class="btn small" data-close>Abbrechen</button><button class="btn primary small" data-save-log>Speichern</button></div></div>`)}
function openSOS(){openSheet(`<div class="sheethead"><div><div class="kicker">SOS · DRANG-MOMENT</div><h2>Was triggert dich gerade?</h2></div><button class="close" data-close>×</button></div><div class="stack"><div class="muted">Ein Tap genügt. Danach bekommst du direkt einen passenden Impuls.</div><div class="trigger-grid">${['Stress','Kaffee','Gewohnheit','Gesellschaft'].map(t=>`<button class="trigger" data-sos-trigger="${t}">${t}</button>`).join('')}</div></div>`)}
function showIntervention(t){const map={Stress:'Wechsle kurz den Ort, lockere Schultern und Kiefer und atme langsam aus. Danach entscheidest du neu.',Kaffee:'Stell den Kaffee kurz weg, wechsel den Platz und trink einen Schluck Wasser. Unterbrich nur die Reihenfolge.',Gewohnheit:'Ändere einen Teil des Ablaufs: Ort, Hand oder nächste Handlung. Eine kleine Abweichung reicht.',Gesellschaft:'Bleib einen Moment sitzen oder hol dir etwas zu trinken. Du musst jetzt nichts endgültig entscheiden.'};openSheet(`<div class="sheethead"><div><div class="kicker">MICRO-IMPULS</div><h2>${t}</h2></div><button class="close" data-close>×</button></div><div class="stack"><div class="card body">${map[t]}</div><div class="kicker">WIE IST DER DRANG JETZT?</div><div class="grid2"><button class="btn petrol small" data-sos-win="${t}">Gesunken</button><button class="btn small" data-sos-still="${t}">Noch da</button></div></div>`)}
function showStill(t){openSheet(`<div class="sheethead"><div><div class="kicker">DRANG NOCH DA</div><h2>Okay. Noch eine kleine Unterbrechung.</h2></div><button class="close" data-close>×</button></div><div class="stack"><div class="card body">Geh für einen kurzen Moment an einen anderen Ort oder beschäftige deine Hände. Danach entscheidest du wieder selbst.</div><div class="grid2"><button class="btn petrol small" data-sos-win="${t}">Gesunken</button><button class="btn small" data-close>Schließen</button></div></div>`)}
function sosSuccess(t){S.events.push({ts:Date.now(),type:'resist',trigger:t,intensity:null,source:'sos'});save();render();openSheet(`<div class="success"><div class="successmark">✓</div><div class="kicker">ERFOLGSPUNKT</div><h2>Drang gesunken.</h2><div class="muted">Du hast den automatischen Ablauf unterbrochen. Dieser Moment wurde gespeichert.</div><button class="btn petrol" data-close>Zurück zu HEUTE</button></div>`)}
function openProfile(){openSheet(`<div class="sheethead"><div><div class="kicker">ICH</div><h2>Einstellungen bearbeiten</h2></div><button class="close" data-close>×</button></div><div class="stack"><label><div class="kicker" style="margin-bottom:6px">NAME</div><input class="input" id="editName" value="${esc(S.name)}"></label><label><div class="kicker" style="margin-bottom:6px">ZIGARETTEN / TAG</div><input class="input" id="editBaseline" type="number" min="0" max="100" value="${S.baseline}"></label><label><div class="kicker" style="margin-bottom:6px">PACKUNGSPREIS (€)</div><input class="input" id="editPrice" inputmode="decimal" value="${S.packPrice??''}"></label><div><div class="kicker" style="margin-bottom:7px">ZIEL</div><div class="seg"><button class="${S.goal==='quit'?'active':''}" data-goal="quit">Aufhören</button><button class="${S.goal==='reduce'?'active':''}" data-goal="reduce">Reduzieren</button></div></div><button class="btn petrol" data-save-profile>Speichern</button></div>`)}
function renderOnboarding(){onboarding.classList.add('open');onboarding.innerHTML=`<div class="brand">SMOKE LAB</div><div class="head"><div class="kicker">DEIN STARTPUNKT</div><h1>Smoke Lab einrichten.</h1><div class="muted">Vier kurze Angaben. Deine Daten bleiben auf diesem Gerät.</div></div><div class="card stack"><label><div class="kicker" style="margin-bottom:6px">NAME</div><input class="input" id="obName" placeholder="Vorname" value="${esc(S.name)}"></label><label><div class="kicker" style="margin-bottom:6px">ZIGARETTEN / TAG</div><input class="input" id="obBaseline" type="number" min="0" max="100" value="${S.baseline}"></label><label><div class="kicker" style="margin-bottom:6px">PACKUNGSPREIS (€) · OPTIONAL</div><input class="input" id="obPrice" inputmode="decimal" placeholder="z. B. 6,50"></label><div><div class="kicker" style="margin-bottom:7px">HAUPTZIEL</div><div class="goal-grid"><button class="goal active" data-ob-goal="quit">Aufhören</button><button class="goal" data-ob-goal="reduce">Reduzieren</button></div></div></div><button class="btn petrol" data-start>Smoke Lab starten</button>`}
let obGoal='quit',editGoal=S.goal;
document.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab){S.activeTab=tab.dataset.tab;save();render();return}if(e.target.closest('[data-open-log]')){openLog();return}if(e.target.closest('[data-open-sos]')){openSOS();return}if(e.target.closest('[data-close]')||e.target===backdrop){closeSheet();return}const k=e.target.closest('[data-kind]');if(k){draft.type=k.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===k));return}const tr=e.target.closest('[data-trigger]');if(tr){draft.trigger=tr.dataset.trigger;document.querySelectorAll('[data-trigger]').forEach(x=>x.classList.toggle('active',x===tr));return}if(e.target.closest('[data-save-log]')){draft.intensity=Number(document.getElementById('intensity').value);S.events.push({ts:Date.now(),type:draft.type,trigger:draft.trigger,intensity:draft.intensity,source:'manual'});save();closeSheet();render();return}const st=e.target.closest('[data-sos-trigger]');if(st){showIntervention(st.dataset.sosTrigger);return}const win=e.target.closest('[data-sos-win]');if(win){sosSuccess(win.dataset.sosWin);return}const still=e.target.closest('[data-sos-still]');if(still){showStill(still.dataset.sosStill);return}if(e.target.closest('[data-edit-profile]')){editGoal=S.goal;openProfile();return}const goal=e.target.closest('[data-goal]');if(goal){editGoal=goal.dataset.goal;document.querySelectorAll('[data-goal]').forEach(x=>x.classList.toggle('active',x===goal));return}if(e.target.closest('[data-save-profile]')){S.name=document.getElementById('editName').value.trim();S.baseline=Math.max(0,Number(document.getElementById('editBaseline').value)||0);const p=document.getElementById('editPrice').value.replace(',','.');S.packPrice=p?Number(p):null;S.goal=editGoal;save();closeSheet();render();return}if(e.target.closest('[data-reset]')){if(confirm('Alle lokal gespeicherten Smoke-Lab-Daten zurücksetzen?')){localStorage.removeItem(KEY);S=fresh();render()}return}const og=e.target.closest('[data-ob-goal]');if(og){obGoal=og.dataset.obGoal;document.querySelectorAll('[data-ob-goal]').forEach(x=>x.classList.toggle('active',x===og));return}if(e.target.closest('[data-start]')){S.name=document.getElementById('obName').value.trim();S.baseline=Math.max(0,Number(document.getElementById('obBaseline').value)||10);const p=document.getElementById('obPrice').value.replace(',','.');S.packPrice=p?Number(p):null;S.goal=obGoal;S.onboardingCompleted=true;S.startedAt=Date.now();save();onboarding.classList.remove('open');render();return}},true);
document.addEventListener('input',e=>{if(e.target.id==='intensity'){draft.intensity=Number(e.target.value);const v=document.getElementById('intensityValue');if(v)v.textContent=draft.intensity+' / 5'}});
render();
</script>

</body>
