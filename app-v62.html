<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Smoke Lab</title>
<style>
:root{--bg:#F4F5F7;--card:#fff;--petrol:#0F2E2C;--petrol2:#174B46;--accent:#FF6B35;--text:#26343E;--muted:#717A86;--label:#8E8E93;--line:rgba(0,0,0,.03);--soft:#F0F4F2;--shadow:0 12px 40px rgba(0,0,0,.04);--r:26px;--rb:16px}
*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg);scroll-behavior:smooth}body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-y:auto}button,input{font:inherit}.app{width:100%;max-width:414px;min-height:100vh;margin:0 auto}.view{display:none;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(126px + env(safe-area-inset-bottom));flex-direction:column;gap:14px}.view.active{display:flex}.brand{display:flex;align-items:center;gap:10px;min-height:38px}.logo{width:31px;height:31px;display:grid;grid-template-columns:1fr 1fr;gap:3px}.logo i{display:block;background:var(--petrol)}.logo i:nth-child(1){border-radius:11px 3px 11px 3px}.logo i:nth-child(2){border-radius:50%;background:var(--accent)}.logo i:nth-child(3){border-radius:3px 11px 3px 11px}.logo i:nth-child(4){border-radius:11px 3px 11px 3px}.brand strong{font-size:17px;letter-spacing:.3px;color:var(--petrol)}.head{display:flex;flex-direction:column;gap:4px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:800;color:var(--label)}h1{font-size:26px;line-height:1.04;letter-spacing:-.8px;font-weight:850;color:var(--petrol)}h2{font-size:19px;line-height:1.1;letter-spacing:-.35px;font-weight:800;color:var(--petrol)}.muted{font-size:14px;line-height:1.4;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero{position:relative;overflow:hidden;min-height:130px;background:linear-gradient(135deg,var(--petrol) 0%,var(--petrol2) 100%);color:#fff}.hero:after{content:"";position:absolute;width:230px;height:120px;right:-30px;bottom:-56px;border-radius:58% 42% 0 0;background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,.10));transform:rotate(-8deg)}.hero h2{color:#fff;font-size:23px}.hero .kicker,.hero .muted{color:rgba(255,255,255,.68)}.ring{--p:50;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.14) 0);z-index:2}.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#184944}.ring span{position:relative;z-index:1;color:#fff;font-size:11px;font-weight:800}.actions{display:grid;gap:9px}.btn{height:56px;border:0;border-radius:var(--rb);padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;white-space:nowrap;cursor:pointer;transition:transform .12s ease,opacity .12s ease}.btn:active{transform:scale(.985)}.btn.orange{background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(255,107,53,.22)}.btn.petrol{background:var(--petrol);color:#fff}.btn.white{background:#fff;color:var(--petrol);border:1px solid var(--line);box-shadow:var(--shadow)}.metricgrid,.pattern-grid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric,.tile,.stat{background:linear-gradient(145deg,#FBFCFD,#F5F7F8);border:1px solid rgba(15,46,44,.05);border-radius:18px;padding:13px}.metric{min-height:82px}.metric strong,.stat strong{display:block;margin-top:9px;font-size:27px;line-height:1;color:var(--petrol)}.datarow{min-height:38px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}.datarow:first-child{border-top:0}.datarow span:first-child{color:var(--muted)}.datarow b{font-size:13px;max-width:64%;text-align:right;color:var(--petrol)}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:10px;font-weight:800;white-space:nowrap;color:var(--petrol)}.progress{height:6px;border-radius:999px;background:#E7ECEA;overflow:hidden}.progress i{display:block;height:100%;background:var(--petrol);border-radius:999px}.phase-list{display:grid;gap:8px}.phase{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:66px;cursor:pointer}.phase.locked{opacity:.45;box-shadow:none;cursor:default}.phase.active{border-color:rgba(15,46,44,.18)}.phase-num{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:850;color:var(--petrol)}.phase-title{font-size:14px;font-weight:800;color:var(--petrol)}.phase small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}.tile{min-height:100px}.tile .ico{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:9px;font-size:16px;color:var(--petrol)}.tile b{font-size:13px;color:var(--petrol)}.tile small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.score{font-size:50px;font-weight:850;line-height:.9;letter-spacing:-2px;color:var(--petrol)}.stat{min-height:88px}.chart{height:95px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}.chartcol{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}.bar{width:23px;min-height:7px;border-radius:7px 7px 3px 3px;background:#BCD4C8}.bar.today{background:var(--petrol)}.chartcol small{font-size:9px;color:var(--muted)}.settings{padding:3px 16px}.setting{min-height:58px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:14px}.setting:first-child{border-top:0}.setting b{font-size:13px;color:var(--petrol)}.setting span{font-size:13px;color:var(--muted);max-width:60%;text-align:right}.bottom-nav{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;width:min(calc(100% - 18px),396px);height:70px;border-radius:25px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.68);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 15px 40px rgba(15,46,44,.1)}.nav-item{border:0;background:transparent;border-radius:19px;color:#7A8492;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:700;white-space:nowrap}.nav-item.active{color:var(--petrol);background:rgba(15,46,44,.07)}.nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.backdrop{position:fixed;inset:0;z-index:200;display:none;background:rgba(15,23,42,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.backdrop.open{display:block}.sheet{position:fixed;left:50%;bottom:0;z-index:210;width:100%;max-width:414px;max-height:88dvh;overflow:auto;background:#fff;border-radius:32px 32px 0 0;padding:12px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -24px 60px rgba(0,0,0,.16);transform:translate(-50%,110%);transition:transform .32s cubic-bezier(.22,.9,.25,1)}.sheet.open{transform:translate(-50%,0)}.handle{width:38px;height:4px;border-radius:999px;background:#D6D8DB;margin:0 auto 13px}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}.close{width:32px;height:32px;border:0;border-radius:50%;background:#F0F2F3;color:var(--petrol);font-size:20px}.sheet-stack{display:grid;gap:12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:#F1F3F4}.seg button{height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:750}.seg button.active{background:#fff;color:var(--petrol);box-shadow:0 2px 8px rgba(0,0,0,.06)}.trigger-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.trigger{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--petrol);font-size:12px;font-weight:800}.trigger.active{background:var(--petrol);color:#fff}.range{width:100%;accent-color:var(--petrol)}.input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 13px;background:#FAFBFC;color:var(--petrol);font-size:15px;outline:none}.input:focus{background:#fff;border-color:rgba(15,46,44,.26);box-shadow:0 0 0 3px rgba(15,46,44,.06)}.onboarding{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;background:var(--bg)}.onboarding.open{display:block}.onboarding-inner{width:100%;max-width:414px;min-height:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.goal{height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--petrol);font-weight:800}.goal.active{background:var(--petrol);color:#fff}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:250;transform:translate(-50%,12px);opacity:0;background:var(--petrol);color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:360px){.view{padding-left:12px;padding-right:12px}h1{font-size:23px}.btn{font-size:14px}.bottom-nav{width:calc(100% - 10px)}}
</style>
</head>
<body>
<div class="app"><main id="today" class="view active"></main><main id="lab" class="view"></main><main id="patterns" class="view"></main><main id="progress" class="view"></main><main id="me" class="view"></main></div>
<nav class="bottom-nav" id="bottomNav">
<button class="nav-item active" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg><span>HEUTE</span></button>
<button class="nav-item" data-tab="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8"/></svg><span>LABOR</span></button>
<button class="nav-item" data-tab="patterns"><svg viewBox="0 0 24 24"><path d="M5 20v-5M12 20V9M19 20V4"/></svg><span>MUSTER</span></button>
<button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="m4 17 5-6 4 3 7-9M16 5h4v4"/></svg><span>FORTSCHRITT</span></button>
<button class="nav-item" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>ICH</span></button>
</nav>
<div id="backdrop" class="backdrop"></div><section id="sheet" class="sheet"></section><section id="onboarding" class="onboarding"></section><div id="toast" class="toast"></div>
<script>
const KEY='smokeLab.v61';
const TRIGGERS=['Stress','Kaffee','Gewohnheit','Pause','Nach dem Essen','Gesellschaft'];
const PHASES=[
{title:'Beobachten',sub:'Muster sichtbar machen',task:'Heute zwei Situationen erfassen – ohne sie bewerten zu müssen.',goal:'Erkennen, wann und wodurch dein Rauch-Autopilot startet.',experiments:[['bewusst','Bewusste Zigarette','Eine Situation bewusst beobachten und neutral erfassen.','log'],['kaffee','Kaffee-Test','Beim nächsten Kaffee Trigger und Stärke dokumentieren.','log'],['morgen','Morning Check','Den ersten deutlichen Drang des Tages bewusst erfassen.','log']]},
{title:'Unterbrechen',sub:'Autopilot stören',task:'Heute mindestens einmal einen Drang bewusst unterbrechen.',goal:'Zwischen Trigger und Reaktion einen Entscheidungsraum schaffen.',experiments:[['delay','3-Minuten-Delay','Reaktion kurz verschieben und danach neu entscheiden.','sos'],['ort','Ort wechseln','Beim Trigger bewusst den Ort wechseln.','sos'],['meal','After-Meal Reset','Nach dem Essen zuerst Wasser oder Ortswechsel.','sos']]},
{title:'Entkoppeln',sub:'Trigger lösen',task:'Heute einen bekannten Trigger absichtlich anders beantworten.',goal:'Gewohnte Auslöser Schritt für Schritt von der Zigarette trennen.',experiments:[['coffee2','Coffee Breaker','Kaffee bewusst an einem anderen Ort trinken.','sos'],['hands','Hands Busy','Hände für einen Moment anders beschäftigen.','sos'],['break','Work-Break Test','Eine Pause ohne automatische Zigarette testen.','sos']]},
{title:'Ersetzen',sub:'Neue Antworten testen',task:'Heute bewusst eine neue Antwort auf einen Trigger testen.',goal:'Für häufige Trigger passende Alternativen entwickeln.',experiments:[['water','Wasser-Reset','Bei einem Drang zuerst Wasser holen.','sos'],['walk','Micro-Walk','Ein paar Schritte gehen und danach neu entscheiden.','sos'],['switch','Routine Switch','Einen festen Ablauf gezielt verändern.','sos']]},
{title:'Stabilisieren',sub:'Kontrolle festigen',task:'Heute deine bisher stärkste Strategie erneut einsetzen.',goal:'Die wirksamsten Unterbrechungen gezielt wiederholen.',experiments:[['best','Best Strategy','Deine stärkste Unterbrechung wiederholen.','sos'],['risk','Risk Window','Ein typisches Risikofenster bewusst vorbereiten.','sos'],['choice','Conscious Choice','Vor einer Entscheidung kurz Trigger und Ziel prüfen.','log']]}
];
const SOS={Stress:['Druck unterbrechen','Lockere Kiefer und Schultern. Wechsel kurz den Ort oder geh ein paar Schritte.'],Kaffee:['Ritual trennen','Stell den Kaffee kurz weg, trink Wasser und nimm ihn an einem anderen Platz wieder auf.'],Gewohnheit:['Autopilot stören','Verändere nur einen Teil der Reihenfolge: Ort, Hand oder nächste Handlung.'],Pause:['Pause neu besetzen','Steh kurz auf und beschäftige deine Hände einen Moment anders.'],'Nach dem Essen':['Übergang verändern','Steh direkt auf, trink Wasser und wechsel kurz den Raum.'],Gesellschaft:['Sozialen Sog lösen','Bleib einen Moment ohne mitzugehen, wechsel Gespräch oder Platz und entscheide danach neu.']};
const fresh=()=>({name:'',baseline:10,goal:'quit',startedAt:Date.now(),activeTab:'today',onboardingCompleted:false,events:[],completedExperiments:[],activeExperiment:null});
let state=load(),draft={type:'smoke',trigger:'Stress',intensity:3},sosTrigger=null;
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(){return Math.max(1,Math.min(30,Math.floor((Date.now()-state.startedAt)/86400000)+1))}
function phase(){return Math.min(4,Math.floor((day()-1)/6))}
function todays(){const d=new Date().toDateString();return state.events.filter(e=>new Date(e.timestamp||e.ts).toDateString()===d)}
function smokedToday(){return todays().filter(e=>e.type==='smoke').length}
function resistedToday(){return todays().filter(e=>e.type==='resist').length}
function control(){const a=state.events.slice(-20);if(!a.length)return 50;return Math.round(a.reduce((n,e)=>n+(e.type==='resist'?100:Math.max(20,80-(e.intensity||3)*10)),0)/a.length)}
function topTrigger(){if(state.events.length<8)return 'Noch nicht belastbar';const c={};state.events.forEach(e=>{if(e.trigger)c[e.trigger]=(c[e.trigger]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Noch nicht belastbar'}
function greeting(){const h=new Date().getHours();return h<11?'Guten Morgen':h>=18?'Guten Abend':'Guten Tag'}
function doneCount(i){return PHASES[i].experiments.filter(x=>state.completedExperiments.includes(x[0])).length}
function brand(){return `<div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div><strong>SMOKE LAB</strong></div>`}
function render(){renderToday();renderLab();renderPatterns();renderProgress();renderMe();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===state.activeTab));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.activeTab));if(!state.onboardingCompleted)renderOnboarding();else onboarding.classList.remove('open')}
function renderToday(){const p=PHASES[phase()];today.innerHTML=`${brand()}<header class="head"><div class="kicker">HEUTE · TAG ${day()}</div><h1>${greeting()}${state.name?`, ${esc(state.name)}`:''}</h1><div class="muted">Verstehe den Trigger. Unterbrich das Muster.</div></header><section class="card hero"><div class="row"><div><div class="kicker">PHASE ${phase()+1}</div><h2>${p.title}</h2><div class="muted">${p.sub}</div></div><div class="ring" style="--p:${control()}"><span>${control()}</span></div></div></section><section class="actions"><button class="btn orange" data-open-log>+ Zigarette / Widerstand erfassen</button><button class="btn petrol" data-open-sos>Drang stoppen (SOS)</button></section><section class="card stack"><div><div class="kicker">TAGES-RADAR</div><h2>Heute auf einen Blick</h2></div><div class="metricgrid"><div class="metric"><div class="kicker">ZIGARETTEN</div><strong>${smokedToday()}</strong></div><div class="metric"><div class="kicker">UNTERBRECHUNGEN</div><strong>${resistedToday()}</strong></div></div><div><div class="datarow"><span>Muster</span><b>${esc(topTrigger())}</b></div><div class="datarow"><span>Labor</span><b>${doneCount(phase())}/3 Experimente</b></div></div></section>`}
function renderLab(){const pi=phase(),p=PHASES[pi],done=doneCount(pi);lab.innerHTML=`${brand()}<header class="head"><div class="kicker">LABOR · 30-TAGE-PROGRAMM</div><h1>Trainiere Kontrolle.</h1><div class="muted">Neue Phasen öffnen sich erst, wenn du zeitlich dort angekommen bist.</div></header><section class="card stack"><div class="row"><div><div class="kicker">AKTUELLE PHASE</div><h2>${p.title}</h2></div><span class="pill">TAG ${day()}</span></div><div class="muted">${p.task}</div><div class="progress"><i style="width:${done/3*100}%"></i></div><div class="muted">${done}/3 Experimente abgeschlossen</div></section><section class="phase-list">${PHASES.map((x,i)=>{const locked=i>pi,active=i===pi;return `<article class="card phase ${locked?'locked':''} ${active?'active':''}" ${locked?'':`data-phase="${i}"`}><div class="phase-num">${i+1}</div><div><div class="phase-title">${x.title}</div><small>${locked?`Öffnet an Tag ${i*6+1}`:x.sub}</small></div><span class="pill">${locked?'GESPERRT':active?'AKTIV':`${doneCount(i)}/3`}</span></article>`}).join('')}</section>`}
function renderPatterns(){const n=state.events.length,c=Math.min(8,n);patterns.innerHTML=`${brand()}<header class="head"><div class="kicker">MUSTER</div><h1>Dein Rauchmuster.</h1><div class="muted">Erst Daten sammeln, dann Muster behaupten.</div></header><section class="card stack"><div class="row"><div class="kicker">KALIBRIERUNG</div><h2>${c}/8</h2></div><div class="progress"><i style="width:${c/8*100}%"></i></div><div class="pattern-grid">${tile('⚡','Trigger',n>=8?topTrigger():'Noch nicht belastbar')}${tile('◷','Zeitfenster',n>=8?timeWindow():'Noch nicht belastbar')}${tile('▥','Intensität',n>=8?avgIntensity():'Noch nicht belastbar')}${tile('◎','Kontext',n>=8?'Aus deinen Situationen':'Noch nicht belastbar')}</div></section>`}
function tile(icon,title,text){return `<article class="tile"><div class="ico">${icon}</div><b>${title}</b><small>${esc(text)}</small></article>`}
function avgIntensity(){if(!state.events.length)return 'Noch nicht belastbar';return (state.events.reduce((s,e)=>s+(e.intensity||3),0)/state.events.length).toFixed(1)+' / 5'}
function timeWindow(){const g={Morgen:0,Mittag:0,Nachmittag:0,Abend:0};state.events.forEach(e=>{const h=new Date(e.timestamp||e.ts).getHours();if(h<11)g.Morgen++;else if(h<14)g.Mittag++;else if(h<18)g.Nachmittag++;else g.Abend++});return Object.entries(g).sort((a,b)=>b[1]-a[1])[0][0]}
function last7(){return [6,5,4,3,2,1,0].map(off=>{const d=new Date();d.setDate(d.getDate()-off);return state.events.filter(e=>new Date(e.timestamp||e.ts).toDateString()===d.toDateString()).length})}
function renderProgress(){const vals=last7(),max=Math.max(1,...vals);progress.innerHTML=`${brand()}<header class="head"><div class="kicker">FORTSCHRITT</div><h1>Kontrolle statt Erfolgsserien.</h1><div class="muted">Mehr Wahlmöglichkeit, nicht perfekte Tage.</div></header><section class="card stack"><div class="kicker">KONTROLLWERT</div><div class="row"><div><div class="score">${control()}</div><div class="muted">aus deinen letzten Situationen</div></div><span class="pill">Referenz ${state.baseline}/Tag</span></div></section><section class="stats">${stat('UNTERBRECHUNGEN',state.events.filter(e=>e.type==='resist').length)}${stat('ERFASST',state.events.filter(e=>e.type==='smoke').length)}${stat('HEUTE',smokedToday())}${stat('LABOR',state.completedExperiments.length)}</section><section class="card stack"><div class="kicker">7-TAGE-TREND</div><div class="chart">${vals.map((v,i)=>`<div class="chartcol"><div class="bar ${i===6?'today':''}" style="height:${Math.max(7,Math.round(v/max*62))}px"></div><small>${i===6?'Heute':6-i+'T'}</small></div>`).join('')}</div></section>`}
function stat(l,v){return `<article class="stat"><div class="kicker">${l}</div><strong>${v}</strong></article>`}
function renderMe(){me.innerHTML=`${brand()}<header class="head"><div class="kicker">ICH</div><h1>Deine Einstellungen.</h1><div class="muted">Alles lokal auf diesem Gerät.</div></header><section class="card settings">${setting('Name',state.name||'Nicht gesetzt')}${setting('Ziel',state.goal==='quit'?'Aufhören':'Reduzieren')}${setting('Ausgangswert',state.baseline+' Zigaretten / Tag')}${setting('Programm','Tag '+day()+' · Phase '+(phase()+1))}</section><button class="btn white" data-edit-profile>Profil bearbeiten</button><button class="btn white" data-reset>App zurücksetzen</button>`}
function setting(l,v){return `<div class="setting"><b>${l}</b><span>${esc(v)}</span></div>`}
function renderOnboarding(){onboarding.classList.add('open');onboarding.innerHTML=`<div class="onboarding-inner">${brand()}<header class="head"><div class="kicker">SMOKE LAB</div><h1>Verstehe den Trigger. Unterbrich das Muster.</h1><div class="muted">Kurzes Setup – deine Daten bleiben lokal auf deinem Gerät.</div></header><section class="card stack"><label class="kicker">DEIN VORNAME</label><input class="input" id="obName" value="${esc(state.name)}" placeholder="Vorname"><label class="kicker">ZIGARETTEN PRO TAG</label><input class="input" id="obBase" type="number" min="1" max="80" value="${state.baseline}"><label class="kicker">DEIN ZIEL</label><div class="goal-grid"><button class="goal ${state.goal==='quit'?'active':''}" data-goal="quit">Aufhören</button><button class="goal ${state.goal==='reduce'?'active':''}" data-goal="reduce">Reduzieren</button></div></section><button class="btn petrol" data-start>Smoke Lab starten</button></div>`}
function openSheet(html){sheet.innerHTML=`<div class="handle"></div>${html}`;backdrop.classList.add('open');requestAnimationFrame(()=>sheet.classList.add('open'));document.body.style.overflow='hidden'}
function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open');document.body.style.overflowY='auto'}
function openLog(){draft={type:'smoke',trigger:'Stress',intensity:3};openSheet(`<div class="sheet-head"><div><div class="kicker">ERFASSEN</div><h2>Was ist passiert?</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><div class="seg"><button class="active" data-type="smoke">Geraucht</button><button data-type="resist">Widerstanden</button></div><div><div class="kicker" style="margin-bottom:8px">TRIGGER</div><div class="trigger-grid">${TRIGGERS.map((t,i)=>`<button class="trigger ${i===0?'active':''}" data-trigger="${t}">${t}</button>`).join('')}</div></div><div><div class="row"><div class="kicker">STÄRKE</div><b id="ival">3/5</b></div><input id="irange" class="range" type="range" min="1" max="5" value="3"></div><button class="btn orange" data-save-log>Speichern</button></div>`)}
function openSOS(){openSheet(`<div class="sheet-head"><div><div class="kicker">SOS</div><h2>Was triggert dich gerade?</h2></div><button class="close" data-close>×</button></div><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger" data-sos="${t}">${t}</button>`).join('')}</div>`)}
function showSOS(t){sosTrigger=t;const [title,copy]=SOS[t];openSheet(`<div class="sheet-head"><div><div class="kicker">MIKRO-INTERVENTION</div><h2>${title}</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><div class="muted">${copy}</div></section><button class="btn petrol" data-sos-down>Gesunken</button><button class="btn white" data-sos-still>Noch da</button></div>`)}
function openPhase(i){if(i>phase())return;const p=PHASES[i],current=i===phase();openSheet(`<div class="sheet-head"><div><div class="kicker">PHASE ${i+1} · TAG ${i*6+1}–${i*6+6}</div><h2>${p.title}</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card stack"><div><div class="kicker">ZIEL</div><div class="muted">${p.goal}</div></div>${current?`<div><div class="kicker">HEUTE</div><div class="muted">${p.task}</div></div>`:''}</section>${p.experiments.map(x=>{const done=state.completedExperiments.includes(x[0]);return `<section class="card row"><div><b>${x[1]}</b><div class="muted" style="font-size:11px;margin-top:3px">${x[2]}</div></div>${done?'<span class="pill">✓</span>':current?`<button class="pill" style="border:0" data-exp="${x[0]}" data-mode="${x[3]}">Starten</button>`:'<span class="pill">offen</span>'}</section>`}).join('')}</div>`)}
function profile(){openSheet(`<div class="sheet-head"><div><div class="kicker">PROFIL</div><h2>Daten bearbeiten</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><label class="kicker">NAME</label><input id="pfName" class="input" value="${esc(state.name)}"><label class="kicker">AUSGANGSWERT</label><input id="pfBase" class="input" type="number" min="1" max="80" value="${state.baseline}"><div class="goal-grid"><button class="goal ${state.goal==='quit'?'active':''}" data-pfgoal="quit">Aufhören</button><button class="goal ${state.goal==='reduce'?'active':''}" data-pfgoal="reduce">Reduzieren</button></div><button class="btn petrol" data-save-profile>Speichern</button></div>`)}
function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),1500)}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.activeTab=tab.dataset.tab;save();render();window.scrollTo(0,0);return}if(e.target.closest('[data-open-log]'))return openLog();if(e.target.closest('[data-open-sos]'))return openSOS();if(e.target.closest('[data-close]')||e.target===backdrop)return closeSheet();const typ=e.target.closest('[data-type]');if(typ){draft.type=typ.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===typ));return}const trg=e.target.closest('[data-trigger]');if(trg){draft.trigger=trg.dataset.trigger;document.querySelectorAll('[data-trigger]').forEach(x=>x.classList.toggle('active',x===trg));return}if(e.target.closest('[data-save-log]')){state.events.push({timestamp:Date.now(),type:draft.type,trigger:draft.trigger,intensity:draft.intensity});if(state.activeExperiment&&!state.completedExperiments.includes(state.activeExperiment))state.completedExperiments.push(state.activeExperiment);state.activeExperiment=null;save();closeSheet();render();toastMsg('Gespeichert');return}const sos=e.target.closest('[data-sos]');if(sos)return showSOS(sos.dataset.sos);if(e.target.closest('[data-sos-down]')){state.events.push({timestamp:Date.now(),type:'resist',trigger:sosTrigger,intensity:3,source:'sos'});if(state.activeExperiment&&!state.completedExperiments.includes(state.activeExperiment))state.completedExperiments.push(state.activeExperiment);state.activeExperiment=null;save();closeSheet();render();toastMsg('Drang unterbrochen');return}if(e.target.closest('[data-sos-still]'))return openSheet(`<div class="sheet-head"><div><div class="kicker">ZWEITER SCHRITT</div><h2>Verändere den Kontext.</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><div class="muted">Wechsle für einen Moment Ort, Körperposition oder Tätigkeit. Du musst nichts verbieten – nur den automatischen Ablauf stören.</div></section><button class="btn petrol" data-sos-down>Gesunken</button><button class="btn white" data-close>Schließen</button></div>`);const pc=e.target.closest('[data-phase]');if(pc)return openPhase(Number(pc.dataset.phase));const ex=e.target.closest('[data-exp]');if(ex){state.activeExperiment=ex.dataset.exp;save();return ex.dataset.mode==='sos'?openSOS():openLog()}const g=e.target.closest('[data-goal]');if(g){state.goal=g.dataset.goal;renderOnboarding();return}if(e.target.closest('[data-start]')){state.name=document.getElementById('obName').value.trim()||'Daniel';state.baseline=Math.max(1,Number(document.getElementById('obBase').value)||10);state.onboardingCompleted=true;state.startedAt=Date.now();state.activeTab='today';save();render();window.scrollTo(0,0);return}if(e.target.closest('[data-edit-profile]'))return profile();const pg=e.target.closest('[data-pfgoal]');if(pg){state.goal=pg.dataset.pfgoal;document.querySelectorAll('[data-pfgoal]').forEach(x=>x.classList.toggle('active',x===pg));return}if(e.target.closest('[data-save-profile]')){state.name=document.getElementById('pfName').value.trim()||state.name;state.baseline=Math.max(1,Number(document.getElementById('pfBase').value)||10);save();closeSheet();render();toastMsg('Profil gespeichert');return}if(e.target.closest('[data-reset]')){if(confirm('Smoke Lab wirklich zurücksetzen?')){localStorage.removeItem(KEY);state=fresh();render();window.scrollTo(0,0)}}});
document.addEventListener('input',e=>{if(e.target.id==='irange'){draft.intensity=Number(e.target.value);document.getElementById('ival').textContent=draft.intensity+'/5'}});
render();
</script>
</body>
</html>
