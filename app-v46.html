<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5F3EE"><title>Smoke Lab</title><style>:root{--bg:#F5F3EE;--card:#FFFEFB;--ink:#183B36;--text:#222724;--muted:#74807B;--line:#E5E4DE;--orange:#E88945;--green:#4D9270;--soft:#EBF1EE;--shadow:0 8px 22px rgba(24,59,54,.065);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{max-width:620px;margin:auto;min-height:100dvh;padding:0 16px calc(80px + env(safe-area-inset-bottom))}.header{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;background:rgba(245,243,238,.97);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:12px;font-weight:900;letter-spacing:.12em}.flask{width:26px;height:26px;border:2px solid var(--ink);border-top:0;border-radius:5px 5px 10px 10px;transform:rotate(45deg);position:relative}.flask:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--orange);right:2px;bottom:2px}.page{display:none;gap:9px}.page.active{display:grid}.eyebrow{font-size:8.5px;letter-spacing:.12em;font-weight:900;color:var(--muted);text-transform:uppercase}.title{font-size:22px;line-height:1.04;letter-spacing:-.035em;font-weight:850;color:var(--ink)}.subtitle{font-size:10.3px;line-height:1.38;color:var(--muted);margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}.hero{background:var(--ink);color:#fff;border:0}.hero .eyebrow,.hero .subtitle{color:rgba(255,255,255,.68)}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.pill{border-radius:999px;padding:6px 8px;background:var(--soft);color:var(--ink);font-size:8px;font-weight:850;white-space:nowrap}.hero .pill{background:rgba(255,255,255,.12);color:#fff}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.metric{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px}.metric b{display:block;font-size:16px;line-height:1}.metric span{display:block;margin-top:3px;font-size:7.2px;color:rgba(255,255,255,.68)}.actions{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}.btn{min-height:56px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:10.8px;font-weight:850;padding:9px 10px}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}.btn.ghost{background:transparent}.btn.full{width:100%}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.section-head h2{font-size:14px;margin:2px 0 0;color:var(--ink)}.copy{font-size:10.2px;line-height:1.4;color:var(--muted);margin-top:4px}.insight-stack{display:grid;grid-template-columns:1fr 1fr;gap:10px}.insight-stack>div+div{border-left:1px solid var(--line);padding-left:10px}.next{border-left:3px solid var(--orange)!important}.progress{height:7px;border-radius:999px;background:#EAECE8;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:var(--green);border-radius:inherit}.phase-grid{display:grid;gap:7px}.phase{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:9px}.phase-num{width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-weight:900}.phase b{display:block;font-size:10.5px;color:var(--ink)}.phase small{display:block;color:var(--muted);font-size:8.5px;margin-top:2px}.phase.active{border-color:#B9CCC4;background:#FCFFFD}.dna{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dna .card{box-shadow:none;padding:12px}.dna b{font-size:12px;color:var(--ink)}.dna small{display:block;font-size:8.5px;color:var(--muted);margin-top:3px}.mini-list{display:grid;gap:7px;margin-top:9px}.row{display:flex;justify-content:space-between;gap:10px;padding-top:7px;border-top:1px solid var(--line);font-size:9.5px}.row:first-child{border-top:0;padding-top:0}.chart{height:84px;display:flex;align-items:end;gap:6px;padding:9px 0 16px}.bar{flex:1;min-width:0;background:#BFD8CB;border-radius:6px 6px 3px 3px;position:relative}.bar.smoke{background:#767D79}.bar span{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);font-size:6.8px;color:var(--muted);white-space:nowrap}.settings{display:grid}.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.setting:first-child{border-top:0}.setting b{font-size:10.5px;color:var(--ink)}.setting small{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}.linkbtn{border:0;background:transparent;color:var(--ink);font-size:9.5px;font-weight:850;padding:5px}.danger{color:#9D4C36!important}.nav{position:fixed;left:50%;bottom:0;z-index:40;transform:translateX(-50%);width:min(620px,100%);height:calc(66px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(250,249,245,.97);border-top:1px solid var(--line);backdrop-filter:blur(15px)}.tab{border:0;background:transparent;border-radius:13px;color:#7C8682;display:grid;place-items:center;align-content:center;gap:3px;font-size:7.4px;font-weight:800}.tab i{font-style:normal;font-size:18px}.tab.active{background:var(--soft);color:var(--ink)}.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;padding:12px;background:rgba(18,31,28,.32);backdrop-filter:blur(9px)}.overlay.open{display:flex}.sheet{width:min(100%,560px);max-height:88dvh;overflow:auto;background:#fff;border-radius:24px;border:1px solid var(--line);padding:18px;box-shadow:0 28px 70px rgba(0,0,0,.2)}.sheet h2{margin:4px 0 3px;font-size:20px;color:var(--ink)}.sheet p{font-size:10.5px;line-height:1.45;color:var(--muted);margin:0 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.select{min-height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;padding:10px;font-size:10px;font-weight:800}.select.selected{background:var(--soft);border-color:#AFC6BC}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale .select{text-align:center;min-height:50px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size:9px;font-weight:800;color:var(--ink)}.chip.selected{background:var(--soft);border-color:#ABC2B8}.safe{padding:11px;border-radius:14px;background:#FFF8F0;border:1px solid #F0D8C5;font-size:10px;color:#7D5A3D;margin-bottom:10px}.intervention{background:var(--ink);color:#fff;border-radius:22px;padding:20px;text-align:center}.intervention .eyebrow{color:rgba(255,255,255,.66)}.intervention h2{color:#fff}.timer{font-size:46px;font-weight:900;margin:16px 0 7px}.intervention p{color:rgba(255,255,255,.72)}.sheet-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}@media(max-width:370px){.title{font-size:20px}.btn{font-size:9.8px}.tab{font-size:6.8px}.insight-stack{gap:8px}.insight-stack>div+div{padding-left:8px}}</style></head><body><div class="app"><header class="header"><div class="brand"><span class="flask"></span><span>SMOKE LAB</span></div></header><section id="today" class="page"></section><section id="lab" class="page"></section><section id="patterns" class="page"></section><section id="progress" class="page"></section><section id="me" class="page"></section></div><nav class="nav" aria-label="Hauptnavigation"><button class="tab active" data-tab="today"><i>⌂</i><span>HEUTE</span></button><button class="tab" data-tab="lab"><i>◫</i><span>LABOR</span></button><button class="tab" data-tab="patterns"><i>⌁</i><span>MUSTER</span></button><button class="tab" data-tab="progress"><i>↗</i><span>FORTSCHRITT</span></button><button class="tab" data-tab="me"><i>○</i><span>ICH</span></button></nav><div id="craving" class="overlay"><div class="sheet"><div class="eyebrow" id="cravingStep">DRANG · 1/3</div><h2 id="cravingTitle"></h2><p id="cravingSub"></p><div id="cravingBody"></div><div class="sheet-actions"><button id="cravingBack" class="btn ghost">Abbrechen</button><button id="cravingNext" class="btn primary">Weiter</button></div></div></div><div id="smoke" class="overlay"><div class="sheet"><div class="eyebrow">KURZPROTOKOLL</div><h2>Zigarette erfassen</h2><p>Nur die Daten, die für deine Muster wirklich helfen.</p><div id="smokeBody"></div><div class="sheet-actions"><button id="smokeCancel" class="btn ghost">Abbrechen</button><button id="smokeSave" class="btn primary">Speichern</button></div></div></div><div id="intervention" class="overlay"><div class="sheet"><div id="interventionBody"></div></div></div><script>const KEY='smokeLab.core.v17',$=id=>document.getElementById(id),triggers=['Stress / Überlastung','Kaffee / Ritual','Pause / Leerlauf','Nach dem Essen','Sozial / Gesellschaft','Emotion / Frust'],contexts=['Allein','Mit anderen','Arbeit','Unterwegs / Auto'],phases=[['1','BEOBACHTEN','Tage 1–6 · Muster sichtbar machen'],['2','UNTERBRECHEN','Tage 7–12 · Autopilot unterbrechen'],['3','ENTKOPPELN','Tage 13–18 · Auslöser entkoppeln'],['4','ERSETZEN','Tage 19–24 · neue Antworten testen'],['5','STABILISIEREN','Tage 25–30 · Kontrolle stabilisieren']];const fresh=()=>({startedAt:Date.now(),goal:'quit',baseline:10,smokingYears:null,events:[],activeTab:'today'});let S=load(),c={step:0,trigger:null,intensity:null,context:null},sd={trigger:null,intensity:3},timer=null;function load(){try{return{...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function day(){return Math.min(30,Math.max(1,Math.floor((Date.now()-S.startedAt)/86400000)+1))}function todayEvents(){const n=new Date;return S.events.filter(e=>new Date(e.ts).toDateString()===n.toDateString())}function smokes(){return S.events.filter(e=>e.type==='smoke')}function resists(){return S.events.filter(e=>e.type==='resist')}function controlScore(){const a=S.events.slice(-20);if(!a.length)return 50;return Math.round(a.reduce((x,e)=>x+(e.type==='resist'?100:Math.max(0,70-(e.intensity||3)*8)),0)/a.length)}function phaseIndex(){return Math.min(4,Math.floor((day()-1)/6))}function greeting(){const h=new Date().getHours();return h<12?'Guten Morgen':h<18?'Guten Nachmittag':'Guten Abend'}function topTrigger(){const x={};S.events.forEach(e=>{if(e.trigger)x[e.trigger]=(x[e.trigger]||0)+1});return Object.entries(x).sort((a,b)=>b[1]-a[1])[0]||null}function experiment(){return[{title:'Beobachten, ohne zu verändern',text:'Erfasse heute nur den Moment und den Auslöser. Keine Bewertung.'},{title:'3-Minuten-Verzögerung',text:'Verschiebe einen automatischen Griff bewusst um 3 Minuten.'},{title:'Kaffee-Test',text:'Trenne einmal Kaffee und Zigarette räumlich oder zeitlich.'},{title:'Neustart nach dem Essen',text:'Beende eine Mahlzeit mit Aufstehen, Wasser und Ortswechsel.'},{title:'Morgen-Verzögerung',text:'Verschiebe die erste Zigarette so bewusst wie realistisch.'}][phaseIndex()]}function render(){renderToday();renderLab();renderPatterns();renderProgress();renderMe();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===S.activeTab));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===S.activeTab))}function renderToday(){const t=todayEvents(),sm=t.filter(e=>e.type==='smoke').length,re=t.filter(e=>e.type==='resist').length,b=Math.max(1,S.baseline||10),score=controlScore(),exp=experiment(),top=topTrigger();today.innerHTML=`<div><div class="eyebrow">HEUTE · TAG ${day()}</div><div class="title">${greeting()}.</div><div class="subtitle">Nicht perfekt sein. Den nächsten automatischen Moment sichtbar machen.</div></div><div class="card hero"><div class="topline"><div><div class="eyebrow">PHASE ${phaseIndex()+1} · ${phases[phaseIndex()][1]}</div><div style="font-size:15px;font-weight:850;margin-top:2px">Kontrolle statt Erfolgsserien.</div></div><span class="pill">${score}/100</span></div><div class="metrics"><div class="metric"><b>${sm}</b><span>Zigaretten heute</span></div><div class="metric"><b>${re}</b><span>Unterbrechungen</span></div><div class="metric"><b>${Math.max(0,Math.round((1-sm/b)*100))}%</b><span>vs. Ausgangswert</span></div></div></div><div class="actions"><button class="btn primary" data-action="craving">ICH WILL RAUCHEN</button><button class="btn" data-action="smoke">ICH HABE GERAUCHT</button></div><div class="card"><div class="section-head"><div><div class="eyebrow">HEUTIGES EXPERIMENT</div><h2>${exp.title}</h2></div><span class="pill">Phase ${phaseIndex()+1}</span></div><div class="copy">${exp.text}</div></div><div class="card insight-stack"><div><div class="eyebrow">AKTUELLE ERKENNTNIS</div><div class="copy">${top?`Häufigster Auslöser: <b>${top[0]}</b> (${top[1]} Situationen).`:'Noch keine belastbare Aussage. Nach einigen Situationen erscheint hier dein erstes Muster.'}</div></div><div class="next"><div class="eyebrow">NÄCHSTER SCHRITT</div><div class="copy">${top?`Beim nächsten <b>${top[0]}</b>-Moment zuerst den Drang erfassen.`:'Beim nächsten Drang zuerst „Ich will rauchen“ wählen.'}</div></div></div>`}function renderLab(){const e=experiment(),pi=phaseIndex();lab.innerHTML=`<div><div class="eyebrow">LABOR · 30-TAGE-PROGRAMM</div><div class="title">Trainiere Kontrolle.</div><div class="subtitle">Fünf Phasen. Kleine Experimente. Keine Strafe für Rückschritte.</div></div><div class="phase-grid">${phases.map((p,i)=>`<div class="card phase ${i===pi?'active':''}"><div class="phase-num">${p[0]}</div><div><b>${p[1]}</b><small>${p[2]}</small></div><span class="pill">${i<pi?'✓':i===pi?'Aktiv':'Später'}</span></div>`).join('')}</div><div class="card"><div class="eyebrow">AKTUELLE MISSION</div><div class="section-head"><h2>${e.title}</h2><span class="pill">Tag ${day()}</span></div><div class="copy">${e.text}</div><div class="progress"><span style="width:${((day()-1)%6+1)/6*100}%"></span></div></div>`}function renderPatterns(){const top=topTrigger(),all=S.events.length;patterns.innerHTML=`<div><div class="eyebrow">MUSTER</div><div class="title">Dein Rauchmuster.</div><div class="subtitle">Auslöser, Zeit, Stärke, Kontext und passende Gegenstrategien.</div></div>`;if(all<8){patterns.innerHTML+=`<div class="card"><div class="eyebrow">KALIBRIERUNG</div><div class="copy">${all}/8 Situationen erfasst. Smoke Lab zeigt Muster erst, wenn genügend Daten vorhanden sind.</div><div class="progress"><span style="width:${all/8*100}%"></span></div></div>`;return}const x={};S.events.forEach(e=>x[e.trigger]=(x[e.trigger]||0)+1);const sorted=Object.entries(x).sort((a,b)=>b[1]-a[1]).slice(0,4);patterns.innerHTML+=`<div class="dna"><div class="card"><div class="eyebrow">HÄUFIGSTER AUSLÖSER</div><b>${top?.[0]||'–'}</b><small>${top?.[1]||0} Situationen</small></div><div class="card"><div class="eyebrow">AUTOMATIK</div><b>${Math.round(smokes().length/Math.max(1,all)*100)}%</b><small>Anteil gerauchter Situationen</small></div><div class="card"><div class="eyebrow">BESTE REAKTION</div><b>${resists().length?'Unterbrechen':'Noch offen'}</b><small>${resists().length} erfolgreiche Unterbrechungen</small></div><div class="card"><div class="eyebrow">RISIKOZEIT</div><b>${riskHour()}</b><small>häufigstes Zeitfenster</small></div></div><div class="card"><div class="eyebrow">AUSLÖSERVERTEILUNG</div><div class="mini-list">${sorted.map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div>`}function riskHour(){if(!S.events.length)return'–';const c={};S.events.forEach(e=>{const h=new Date(e.ts).getHours();c[h]=(c[h]||0)+1});const h=+Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];return`${String(h).padStart(2,'0')}:00–${String((h+1)%24).padStart(2,'0')}:00`}function renderProgress(){const sc=controlScore(),sm=smokes().length,re=resists().length,t=todayEvents(),ti=t.length?Math.round(t.reduce((a,e)=>a+(e.intensity||3),0)/t.length*10)/10:'–',days=[6,5,4,3,2,1,0].map(n=>{const d=new Date;d.setDate(d.getDate()-n);const ev=S.events.filter(e=>new Date(e.ts).toDateString()===d.toDateString());return{label:n?`${n}T`:'Heute',v:ev.filter(e=>e.type==='resist').length-ev.filter(e=>e.type==='smoke').length}}),max=Math.max(1,...days.map(x=>Math.abs(x.v)));progress.innerHTML=`<div><div class="eyebrow">FORTSCHRITT</div><div class="title">Kontrolle statt Erfolgsserien.</div><div class="subtitle">Fortschritt heißt mehr Wahlmöglichkeit, nicht perfekte Tage.</div></div><div class="card hero"><div class="eyebrow">KONTROLLWERT</div><div style="font-size:42px;font-weight:900;line-height:1;margin-top:5px">${sc}</div><div class="subtitle">von 100 · aus deinen letzten Situationen</div></div><div class="dna"><div class="card"><div class="eyebrow">UNTERBRECHUNGEN</div><b>${re}</b><small>erfolgreich</small></div><div class="card"><div class="eyebrow">ERFASST</div><b>${sm}</b><small>Zigaretten</small></div><div class="card"><div class="eyebrow">INTENSITÄT</div><b>${ti}</b><small>Ø heute</small></div><div class="card"><div class="eyebrow">AUSGANGSWERT</div><b>${S.baseline||'–'}</b><small>Zigaretten / Tag</small></div></div><div class="card"><div class="eyebrow">7-TAGE-TREND</div><div class="chart">${days.map(x=>`<div class="bar ${x.v<0?'smoke':''}" style="height:${20+Math.abs(x.v)/max*50}px"><span>${x.label}</span></div>`).join('')}</div></div>`}function renderMe(){me.innerHTML=`<div><div class="eyebrow">ICH</div><div class="title">Schlank verwalten.</div><div class="subtitle">Nur Profil, Datenschutz und Datenverwaltung.</div></div><div class="card settings"><div class="setting"><div><b>Ziel</b><small>${S.goal==='quit'?'Aufhören':'Reduzieren'}</small></div><button class="linkbtn" data-setting="goal">Ändern</button></div><div class="setting"><div><b>Ausgangswert</b><small>${S.baseline||'–'} Zigaretten / Tag</small></div><button class="linkbtn" data-setting="baseline">Ändern</button></div><div class="setting"><div><b>Rauchjahre</b><small>${S.smokingYears||'Nicht angegeben'}</small></div><button class="linkbtn" data-setting="years">Ändern</button></div><div class="setting"><div><b>Sprache</b><small>Deutsch</small></div><span class="pill">DE</span></div><div class="setting"><div><b>Labor-Bericht</b><small>Anonymisierte Zusammenfassung kopieren</small></div><button class="linkbtn" data-setting="report">Kopieren</button></div><div class="setting"><div><b>Datenschutz & Info</b><small>Lokal gespeichert · kein Konto</small></div><button class="linkbtn" data-setting="about">Info</button></div><div class="setting"><div><b>Hinweis</b><small>Kein Ersatz für medizinische Behandlung</small></div><button class="linkbtn" data-setting="disclaimer">Info</button></div><div class="setting"><div><b>Alle Daten zurücksetzen</b><small>Unwiderruflich auf diesem Gerät</small></div><button class="linkbtn danger" data-setting="reset">Zurücksetzen</button></div></div>`}function openCraving(){c={step:0,trigger:null,intensity:null,context:null};craving.classList.add('open');renderCraving()}function renderCraving(){cravingStep.textContent=`DRANG · ${c.step+1}/3`;if(c.step===0){cravingTitle.textContent='Was löst den Drang gerade aus?';cravingSub.textContent='Wähle den stärksten Auslöser.';cravingBody.innerHTML=`<div class="grid2">${triggers.map(t=>`<button class="select ${c.trigger===t?'selected':''}" data-ct="${t}">${t}</button>`).join('')}</div>`}if(c.step===1){cravingTitle.textContent='Wie stark ist der Drang?';cravingSub.textContent='1 = leicht · 5 = sehr stark';cravingBody.innerHTML=`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="select ${c.intensity===n?'selected':''}" data-ci="${n}">${n}</button>`).join('')}</div>`}if(c.step===2){cravingTitle.textContent='Wo bist du gerade?';cravingSub.textContent='Der Kontext entscheidet mit, welche Hilfe sinnvoll ist.';cravingBody.innerHTML=`<div class="grid2">${contexts.map(t=>`<button class="select ${c.context===t?'selected':''}" data-cc="${t}">${t}</button>`).join('')}</div>`}cravingBack.textContent=c.step?'Zurück':'Abbrechen';cravingNext.textContent=c.step===2?'Passende Hilfe':'Weiter'}function pickIntervention(){if(c.context==='Unterwegs / Auto'){interventionBody.innerHTML=`<div class="safe"><b>Sicherheit zuerst.</b><br>Bediene Smoke Lab nicht während der Fahrt. Nutze die Hilfe erst, wenn du sicher stehst oder geparkt hast.</div><button class="btn primary full" data-safe>Ich stehe sicher / bin geparkt</button><button class="btn ghost full" style="margin-top:7px" data-close-int>Schließen</button>`;return}startIntervention()}function config(){if(c.trigger==='Stress / Überlastung')return{s:60,title:'Körperlicher Neustart',txt:'Löse Schultern und Kiefer. Atme ruhig aus, etwas länger als ein. Keine Atemzählung nötig.'};if(c.trigger==='Kaffee / Ritual')return{s:90,title:'Ritual trennen',txt:'Stell den Kaffee kurz weg, trink Wasser und wechsle für 90 Sekunden den Ort.'};if(c.trigger==='Nach dem Essen')return{s:90,title:'Neustart nach dem Essen',txt:'Steh auf, trink Wasser und verlasse den Essplatz. Unterbrich nur die gelernte Reihenfolge.'};if(c.trigger==='Emotion / Frust')return{s:120,title:'Drangwelle',txt:'Beobachte den Drang wie eine Welle. Du musst ihn nicht bekämpfen und ihm nicht folgen.'};if(c.trigger==='Sozial / Gesellschaft')return{s:60,title:'Soziale Verzögerung',txt:'Bleib bei der Gruppe, aber verschiebe die erste Zigarette um nur 60 Sekunden.'};return{s:60,title:'Autopilot unterbrechen',txt:'Wechsle Ort oder Tätigkeit für 60 Sekunden. Ziel ist nur, den automatischen Start zu unterbrechen.'}}function startIntervention(){clearInterval(timer);const x=config(),start=Date.now(),draw=()=>{const rem=Math.max(0,x.s-Math.floor((Date.now()-start)/1000));interventionBody.innerHTML=`<div class="intervention"><div class="eyebrow">AKUTHILFE · KONTEXTABHÄNGIG</div><h2>${x.title}</h2><div class="timer">${rem}</div><p>${x.txt}</p></div><div class="sheet-actions"><button class="btn" data-reassess>Früher neu bewerten</button><button class="btn primary" data-smoked-anyway>Ich habe trotzdem geraucht</button></div>`;if(rem<=0){clearInterval(timer);showOutcome()}};draw();timer=setInterval(draw,1000)}function showOutcome(){clearInterval(timer);interventionBody.innerHTML=`<div class="eyebrow">NEU BEWERTEN</div><h2>Wie ist der Drang jetzt?</h2><p>Das Ergebnis verbessert deine persönliche Interventionslogik.</p><div class="grid2"><button class="select" data-outcome="down">Deutlich geringer</button><button class="select" data-outcome="same">Etwa gleich</button><button class="select" data-outcome="up">Stärker</button><button class="select" data-smoked-anyway>Ich habe geraucht</button></div>`}function finish(outcome){S.events.push({ts:Date.now(),type:outcome==='smoked'?'smoke':'resist',trigger:c.trigger,intensity:c.intensity,context:c.context,outcome});save();intervention.classList.remove('open');render();if(outcome==='smoked')openSmoke(c.trigger,c.intensity)}function openSmoke(prefill=null,intensity=3){sd={trigger:prefill,intensity:intensity||3};smoke.classList.add('open');renderSmoke()}function renderSmoke(){smokeBody.innerHTML=`<div class="eyebrow">AUSLÖSER</div><div class="chips">${triggers.map(t=>`<button class="chip ${sd.trigger===t?'selected':''}" data-st="${t}">${t}</button>`).join('')}</div><div class="eyebrow" style="margin-top:14px">DRANG-STÄRKE</div><div class="scale" style="margin-top:7px">${[1,2,3,4,5].map(n=>`<button class="select ${sd.intensity===n?'selected':''}" data-si="${n}">${n}</button>`).join('')}</div>`}function report(){const top=topTrigger();return`# Smoke Lab – anonymer Labor-Bericht\n\n## Ziel\n${S.goal==='quit'?'Aufhören':'Reduzieren'}\n\n## Kennzahlen\n- Dokumentierte Zigaretten: ${smokes().length}\n- Unterbrochene Situationen: ${resists().length}\n- Kontrollwert: ${controlScore()}/100\n\n## Häufigster Auslöser\n${top?`${top[0]} (${top[1]} Situationen)`:'Noch nicht belastbar.'}\n\n## Analyseauftrag\nTrenne Beobachtung und Hypothese klar. Nenne zwei robuste Muster, eine vorsichtige verhaltenspsychologische Erklärung, eine konkrete nächste Mikro-Intervention und eine Frage, die die Datengrundlage verbessert. Keine Diagnose und keine moralische Bewertung.`}document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){S.activeTab=tab.dataset.tab;save();render()}const act=e.target.closest('[data-action]');if(act?.dataset.action==='craving')openCraving();if(act?.dataset.action==='smoke')openSmoke();const ct=e.target.closest('[data-ct]');if(ct){c.trigger=ct.dataset.ct;renderCraving()}const ci=e.target.closest('[data-ci]');if(ci){c.intensity=+ci.dataset.ci;renderCraving()}const cc=e.target.closest('[data-cc]');if(cc){c.context=cc.dataset.cc;renderCraving()}const st=e.target.closest('[data-st]');if(st){sd.trigger=st.dataset.st;renderSmoke()}const si=e.target.closest('[data-si]');if(si){sd.intensity=+si.dataset.si;renderSmoke()}if(e.target.closest('[data-safe]'))startIntervention();if(e.target.closest('[data-close-int]'))intervention.classList.remove('open');if(e.target.closest('[data-reassess]'))showOutcome();if(e.target.closest('[data-smoked-anyway]'))finish('smoked');const out=e.target.closest('[data-outcome]');if(out)finish(out.dataset.outcome);const set=e.target.closest('[data-setting]');if(set){const k=set.dataset.setting;if(k==='goal'){S.goal=S.goal==='quit'?'reduce':'quit';save();render()}if(k==='baseline'){const v=prompt('Ausgangswert: Zigaretten pro Tag',S.baseline||10);if(v&&+v>0){S.baseline=+v;save();render()}}if(k==='years'){const v=prompt('Wie viele Jahre rauchst du?',S.smokingYears||'');if(v!==null){S.smokingYears=v;save();render()}}if(k==='report'){try{await navigator.clipboard.writeText(report());alert('Labor-Bericht kopiert.')}catch{alert(report())}}if(k==='about')alert('Smoke Lab speichert deine Daten lokal auf diesem Gerät. Kein Konto erforderlich.');if(k==='disclaimer')alert('Smoke Lab ist ein Verhaltenstracking-Werkzeug und kein Ersatz für medizinische Beratung, Diagnose oder Behandlung.');if(k==='reset'&&confirm('Alle lokalen Smoke-Lab-Daten wirklich löschen?')){localStorage.removeItem(KEY);S=fresh();save();render()}}});cravingBack.onclick=()=>{if(!c.step){craving.classList.remove('open');return}c.step--;renderCraving()};cravingNext.onclick=()=>{if(c.step===0&&!c.trigger)return;if(c.step===1&&!c.intensity)return;if(c.step===2&&!c.context)return;if(c.step<2){c.step++;renderCraving()}else{craving.classList.remove('open');intervention.classList.add('open');pickIntervention()}};smokeCancel.onclick=()=>smoke.classList.remove('open');smokeSave.onclick=()=>{if(!sd.trigger)return;S.events.push({ts:Date.now(),type:'smoke',trigger:sd.trigger,intensity:sd.intensity});save();smoke.classList.remove('open');render()};render();</script></body></html>
