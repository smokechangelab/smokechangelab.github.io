<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f8f5"><title>Smoke Lab</title><style>:root{--bg:#f3f8f5;--ink:#20362f;--muted:#6d7d76;--line:#dce7e1;--green:#3d6255;--radius:16px;--font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}body{min-height:100dvh}.landing{max-width:560px;min-height:100dvh;margin:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.brand{height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(107,158,139,.18)}.brand-lockup{display:flex;align-items:center;gap:10px}.brand svg{width:34px;height:41px}.brand-name{font-size:12px;font-weight:750;letter-spacing:.22em}.lang-toggle{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:750;color:#86958f}.lang-toggle button{border:0;background:transparent;padding:7px 3px;color:#86958f;font-size:11px;font-weight:750}.lang-toggle button.active{color:#20362f}.lang-toggle .sep{opacity:.45}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px 0}.visual{height:240px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,#dbece3,#eef6f2 58%,#d5e7de);box-shadow:0 10px 28px rgba(37,70,58,.07)}.visual svg{width:100%;height:100%;display:block}.copy h1{font-size:30px;line-height:1.04;letter-spacing:-.035em;margin:0;font-weight:750}.copy p{font-size:14px;line-height:1.55;color:var(--muted);margin:10px 0 0}.cta{width:100%;min-height:50px;border:0;border-radius:var(--radius);background:var(--green);color:#fff;font-size:14px;font-weight:800;box-shadow:0 7px 18px rgba(61,98,85,.16)}.note{text-align:center;color:var(--muted);font-size:10.5px;font-weight:650;margin-top:-4px}@media(max-height:720px){.brand{height:48px}.hero{gap:11px;padding:10px 0}.visual{height:190px}.copy h1{font-size:26px}.copy p{font-size:12.5px;line-height:1.45;margin-top:7px}.cta{min-height:46px}}</style></head><body><main class="landing"><header class="brand"><div class="brand-lockup"><svg viewBox="0 0 48 58" aria-hidden="true"><path d="M18 24v7L8.5 49.5c-1.1 2.2.5 4.8 3 4.8h25c2.5 0 4.1-2.6 3-4.8L30 31v-7" fill="none" stroke="#2C3E35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 24h16" fill="none" stroke="#2C3E35" stroke-width="3" stroke-linecap="round"/><path d="M24 48c-5-1-7-5-5-9 4 1 7-.4 10-4 1 6-1 11-5 13Z" fill="#8FBBA8"/><path d="M22 22c-7-5-4-10 3-12 5-1 7-4 5-8-8 4-11 8-8 12 2 3 6 3 7 7" fill="none" stroke="#8FBBA8" stroke-width="3" stroke-linecap="round"/></svg><span class="brand-name">SMOKE LAB</span></div><div class="lang-toggle" aria-label="Sprache"><button id="langDe" class="active" type="button">DE</button><span class="sep">|</span><button id="langEn" type="button">EN</button></div></header><section class="hero"><div class="visual" aria-label="Eine ruhige Pause im Freien"><svg viewBox="0 0 520 300" role="img"><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7e9df"/><stop offset="1" stop-color="#f3f8f5"/></linearGradient></defs><rect width="520" height="300" fill="url(#sky)"/><circle cx="424" cy="62" r="30" fill="#fff" opacity=".72"/><path d="M0 232c77-35 151-24 219 1 75 27 160 26 301-13v80H0Z" fill="#c3dccf"/><path d="M0 252c91-26 175-7 250 16 78 24 161 16 270-8v40H0Z" fill="#a9cdbb" opacity=".7"/><path d="M329 109c-13 11-22 28-23 50-2 38 18 65 56 68 31 2 53-18 56-49 4-38-16-71-50-78-16-3-29 1-39 9Z" fill="#d7b7a2"/><path d="M346 93c-22 4-36 22-38 50 11-8 24-10 39-7 23 4 40-4 50-22-12-18-29-25-51-21Z" fill="#354b42"/><path d="M303 286c4-53 20-89 47-107 22-15 48-14 70 4 26 21 40 56 43 103Z" fill="#6f9988"/><path d="M363 177c-15 14-26 25-32 34" fill="none" stroke="#d7b7a2" stroke-width="18" stroke-linecap="round"/><path d="M331 212c-22 11-47 14-74 9" fill="none" stroke="#d7b7a2" stroke-width="15" stroke-linecap="round"/><path d="M418 151c31-4 55 4 72 24" fill="none" stroke="#8fbba8" stroke-width="5" stroke-linecap="round" opacity=".55"/><path d="M421 165c27-1 45 6 58 20" fill="none" stroke="#b9d5c7" stroke-width="4" stroke-linecap="round" opacity=".7"/><path d="M429 180c18 0 31 5 40 13" fill="none" stroke="#d4e7de" stroke-width="3.5" stroke-linecap="round"/><circle cx="107" cy="73" r="42" fill="#c7ddd2" opacity=".6"/><path d="M74 114c25-44 55-57 89-39-12 31-36 48-72 50" fill="#91b8a5" opacity=".7"/></svg></div><div class="copy"><h1>Verstehe dein Rauchen. Ohne Druck.</h1><p>Smoke Lab entschlüsselt deine persönlichen Trigger und Muster. Erfasse wenige Situationen und finde heraus, wann und warum du wirklich rauchst.</p></div><button id="startBtn" class="cta">Jetzt Starten</button><div class="note">100% anonym • Daten bleiben lokal auf deinem Gerät</div></section></main><script>const KEY='smokeLab.v31';function readState(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function ensureState(lang){let s=readState();if(!s)s={onboarded:false,profile:{goal:null,cigs:null,reasons:[]},settings:{language:lang},logs:[]};s.settings=s.settings||{};s.settings.language=lang;localStorage.setItem(KEY,JSON.stringify(s));sync(lang)}function sync(lang){langDe.classList.toggle('active',lang==='de');langEn.classList.toggle('active',lang==='en')}const existing=readState();if(existing&&existing.onboarded)location.replace('app-v40.html?v=audit1');const initialLang=existing?.settings?.language||'de';sync(initialLang);langDe.onclick=()=>ensureState('de');langEn.onclick=()=>ensureState('en');document.getElementById('startBtn').onclick=()=>location.href='app-v40.html?v=audit1';</script></body></html>
