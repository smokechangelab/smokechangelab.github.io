<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Smoke Lab</title>
<style>
:root{--bg:#F2F4F7;--card:#FFFFFF;--primary:#0F2E2C;--primary2:#174944;--accent:#FF6B35;--muted:#7E8792;--label:#8E8E93;--border:rgba(0,0,0,.04);--soft:#EEF3F1;--shadow:0 12px 40px rgba(0,0,0,.04);--r:26px;--rb:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--primary);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-y:auto}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:414px;min-height:100vh;min-height:100dvh;margin:0 auto;position:relative}
.view{display:none;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(140px + env(safe-area-inset-bottom));grid-auto-rows:max-content;gap:14px}
.view.active{display:grid}
.brand{display:flex;align-items:center;gap:10px;min-height:36px}
.logo{width:30px;height:30px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.logo i{display:block;background:var(--primary)}
.logo i:nth-child(1){border-radius:11px 3px 11px 3px}
.logo i:nth-child(2){border-radius:50%;background:var(--accent)}
.logo i:nth-child(3){border-radius:3px 11px 3px 11px}
.logo i:nth-child(4){border-radius:11px 3px 11px 3px}
.brand strong{font-size:17px;font-weight:850;letter-spacing:.25px}
.head{display:grid;gap:4px;margin-top:2px}
.kicker{font-size:11px;line-height:1.2;text-transform:uppercase;letter-spacing:.8px;font-weight:800;color:var(--label)}
h1{font-size:24px;line-height:1.05;letter-spacing:-.7px;font-weight:850;color:var(--primary)}
h2{font-size:19px;line-height:1.12;letter-spacing:-.4px;font-weight:820;color:var(--primary)}
.muted{font-size:14px;line-height:1.4;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:11px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero{position:relative;overflow:hidden;min-height:132px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff;border:none}
.hero:after{content:"";position:absolute;right:-30px;bottom:-60px;width:225px;height:120px;border-radius:52% 48% 0 0;background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,.095));transform:rotate(-7deg)}
.hero h2{color:#fff;font-size:22px}.hero .kicker,.hero .muted{color:rgba(255,255,255,.68)}
.hero-main{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:relative;z-index:2}
.ring{--p:50;width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.14) 0);position:relative}
.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#194B46}
.ring span{position:relative;z-index:1;color:#fff;font-size:11px;font-weight:850}
.actions{display:grid;gap:9px}.btn{height:56px;border:0;border-radius:var(--rb);padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:820;white-space:nowrap;transition:transform .12s ease,opacity .12s ease}.btn:active{transform:scale(.985)}
.btn.orange{background:linear-gradient(135deg,#FF875F 0%,var(--accent) 100%);color:#fff;box-shadow:0 10px 24px rgba(255,107,53,.24)}
.btn.petrol{background:var(--primary);color:#fff;box-shadow:0 8px 22px rgba(15,46,44,.16)}
.btn.white{background:#fff;color:var(--primary);border:1px solid var(--border);box-shadow:var(--shadow)}
.btn.danger{color:#C64646}
.metric-grid,.pattern-grid,.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric,.pattern,.stat{background:linear-gradient(145deg,#FBFCFD,#F5F7F8);border:1px solid rgba(15,46,44,.045);border-radius:18px;padding:13px}
.metric{min-height:84px}.metric strong,.stat strong{display:block;margin-top:9px;font-size:27px;line-height:1;font-weight:850}
.data-row{min-height:38px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}.data-row:first-child{border-top:0}.data-row span:first-child{color:var(--muted)}.data-row b{max-width:64%;text-align:right}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:10px;font-weight:850;white-space:nowrap}
.progress{height:6px;border-radius:999px;background:#E6ECE9;overflow:hidden}.progress span{display:block;height:100%;background:var(--primary);border-radius:inherit}
.phase-list{display:grid;gap:8px}.phase{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:66px}.phase.locked{opacity:.48;box-shadow:none}.phase.active{border-color:rgba(15,46,44,.18)}.phase-num{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:850}.phase-title{font-size:14px;font-weight:820}.phase small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.25}
.pattern{min-height:102px}.pattern svg{width:28px;height:28px;margin-bottom:9px;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pattern b{font-size:13px}.pattern small{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.3}
.score{font-size:50px;font-weight:850;line-height:.9;letter-spacing:-2px}.stat{min-height:88px}.chart{height:96px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}.chart-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:23px;min-height:7px;border-radius:7px 7px 3px 3px;background:#BDD4C9}.bar.today{background:var(--primary)}.chart-col small{font-size:9px;color:var(--muted)}
.settings{padding:3px 16px}.setting{min-height:58px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:14px}.setting:first-child{border-top:0}.setting b{font-size:13px}.setting span{font-size:13px;color:var(--muted);max-width:60%;text-align:right}
.bottom-nav{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;width:min(calc(100% - 18px),396px);height:72px;border-radius:25px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.68);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 16px 42px rgba(15,46,44,.10)}
.nav-item{min-width:0;border:0;background:transparent;border-radius:19px;color:#7B8492;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:750;white-space:nowrap}.nav-item.active{color:var(--primary);background:rgba(15,46,44,.07)}.nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.backdrop{position:fixed;inset:0;z-index:200;display:none;background:rgba(15,23,42,.40);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.backdrop.open{display:block}
.sheet{position:fixed;left:50%;bottom:0;z-index:210;width:100%;max-width:414px;max-height:88dvh;overflow-y:auto;background:#fff;border-radius:32px 32px 0 0;padding:12px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -24px 60px rgba(0,0,0,.16);transform:translate(-50%,110%);transition:transform .33s cubic-bezier(.16,1,.3,1)}.sheet.open{transform:translate(-50%,0)}.handle{width:38px;height:4px;border-radius:999px;background:#D5D8DB;margin:0 auto 13px}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}.close{width:32px;height:32px;border:0;border-radius:50%;background:#F0F2F3;color:var(--primary);font-size:20px}.sheet-stack{display:grid;gap:12px}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:#F1F3F4}.seg{height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:780}.seg.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.trigger-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.trigger{min-height:44px;border:1px solid rgba(0,0,0,.055);border-radius:13px;background:#fff;color:var(--primary);font-size:12px;font-weight:800}.trigger.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.range{width:100%;accent-color:var(--primary)}
.input{width:100%;height:48px;border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:0 13px;background:#FAFBFC;color:var(--primary);font-size:15px;outline:none}.input:focus{background:#fff;border-color:rgba(15,46,44,.28);box-shadow:0 0 0 3px rgba(15,46,44,.06)}
.onboarding{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;background:var(--bg)}.onboarding.open{display:block}.onboarding-inner{width:100%;max-width:414px;min-height:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:grid;align-content:start;gap:14px}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.goal{height:48px;border:1px solid rgba(0,0,0,.055);border-radius:14px;background:#fff;color:var(--primary);font-weight:800}.goal.active{background:var(--primary);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));z-index:260;transform:translate(-50%,12px);opacity:0;background:var(--primary);color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.view{padding-left:12px;padding-right:12px}h1{font-size:22px}.btn{font-size:14px}.bottom-nav{width:calc(100% - 10px)}}
</style>
</head>
<body>
<div class="app"><main id="today" class="view active"></main><main id="lab" class="view"></main><main id="patterns" class="view"></main><main id="progress" class="view"></main><main id="me" class="view"></main></div>
<nav class="bottom-nav" id="bottomNav" hidden>
<button class="nav-item active" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg><span>HEUTE</span></button>
<button class="nav-item" data-tab="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8"/></svg><span>LABOR</span></button>
<button class="nav-item" data-tab="patterns"><svg viewBox="0 0 24 24"><path d="M5 20v-5M12 20V9M19 20V4"/></svg><span>MUSTER</span></button>
<button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="m4 17 5-6 4 3 7-9M16 5h4v4"/></svg><span>FORTSCHRITT</span></button>
<button class="nav-item" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>ICH</span></button>
</nav>
<div id="backdrop" class="backdrop"></div><section id="sheet" class="sheet" aria-modal="true"></section><section id="onboarding" class="onboarding"></section><div id="toast" class="toast"></div>
<script>
const KEY='smokeLab.v65';
const TRIGGERS=['Stress','Kaffee','Gewohnheit','Pause','Nach dem Essen','Gesellschaft'];
const PHASES=[
{title:'Beobachten',sub:'Muster sichtbar machen',task:'Heute zwei Situationen erfassen – ohne sie zu bewerten.'},
{title:'Unterbrechen',sub:'Autopilot stören',task:'Heute mindestens einmal einen Drang bewusst unterbrechen.'},
{title:'Entkoppeln',sub:'Trigger lösen',task:'Heute einen bekannten Trigger absichtlich anders beantworten.'},
{title:'Ersetzen',sub:'Neue Antworten testen',task:'Heute bewusst eine neue Antwort auf einen Trigger testen.'},
{title:'Stabilisieren',sub:'Kontrolle festigen',task:'Heute deine bisher stärkste Strategie erneut einsetzen.'}
];
function fresh(){return{name:'',baseline:10,goal:'quit',startedAt:Date.now(),activeTab:'today',events:[],onboarded:false}}
let S=load();let logDraft={type:'smoke',trigger:'Stress',intensity:3};let sosTrigger=null;
function load(){try{return{...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(){return Math.max(1,Math.min(30,Math.floor((Date.now()-S.startedAt)/86400000)+1))}
function phase(){return Math.min(4,Math.floor((day()-1)/6))}
function phaseStart(i){return i*6+1}
function greeting(){const h=new Date().getHours();return h<11?'Guten Morgen':h>=18?'Guten Abend':'Guten Tag'}
function todayEvents(){const k=new Date().toDateString();return S.events.filter(e=>new Date(e.ts).toDateString()===k)}
function smokeToday(){return todayEvents().filter(e=>e.type==='smoke').length}
function resistToday(){return todayEvents().filter(e=>e.type==='resist').length}
function score(){const r=S.events.slice(-20);if(!r.length)return 50;return Math.round(r.reduce((n,e)=>n+(e.type==='resist'?100:Math.max(20,80-(e.intensity||3)*10)),0)/r.length)}
function topTrigger(){if(S.events.length<8)return'Noch nicht belastbar';const c={};S.events.forEach(e=>{if(e.trigger)c[e.trigger]=(c[e.trigger]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Noch nicht belastbar'}
function avgIntensity(){if(S.events.length<8)return'Noch nicht belastbar';return(S.events.reduce((n,e)=>n+(e.intensity||3),0)/S.events.length).toFixed(1)+'/5'}
function brand(){return`<div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div><strong>Smoke Lab</strong></div>`}
function setting(k,v){return`<div class="setting"><b>${esc(k)}</b><span>${esc(v)}</span></div>`}
function render(){renderToday();renderLab();renderPatterns();renderProgress();renderMe();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===S.activeTab));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.activeTab));document.getElementById('bottomNav').hidden=!S.onboarded;if(!S.onboarded)renderOnboarding();else document.getElementById('onboarding').classList.remove('open')}
function renderToday(){const p=PHASES[phase()];document.getElementById('today').innerHTML=`${brand()}<header class="head"><div class="kicker">Heute · Tag ${day()}</div><h1>${greeting()}${S.name?', '+esc(S.name):''}</h1><div class="muted">Verstehe den Trigger. Unterbrich das Muster.</div></header><section class="card hero"><div class="hero-main"><div><div class="kicker">Phase ${phase()+1}</div><h2>${p.title}</h2><div class="muted" style="margin-top:5px">${p.sub}</div></div><div class="ring" style="--p:${score()}"><span>${score()}</span></div></div></section><section class="actions"><button class="btn orange" data-open-log>+ Zigarette / Widerstand erfassen</button><button class="btn petrol" data-open-sos>Drang stoppen (SOS)</button></section><section class="card stack"><div><div class="kicker">Tages-Radar</div><h2 style="margin-top:3px">Heute auf einen Blick</h2></div><div class="metric-grid"><article class="metric"><div class="kicker">Zigaretten</div><strong>${smokeToday()}</strong></article><article class="metric"><div class="kicker">Unterbrechungen</div><strong>${resistToday()}</strong></article></div><div><div class="data-row"><span>Muster</span><b>${esc(topTrigger())}</b></div><div class="data-row"><span>Kontrollwert</span><b>${score()}/100</b></div></div></section>`}
function renderLab(){const cp=phase();document.getElementById('lab').innerHTML=`${brand()}<header class="head"><div class="kicker">Labor · 30-Tage-Programm</div><h1>Trainiere Kontrolle.</h1><div class="muted">Neue Phasen öffnen sich erst, wenn du zeitlich dort angekommen bist.</div></header><section class="card stack"><div class="row"><div><div class="kicker">Aktuelle Phase</div><h2>${PHASES[cp].title}</h2></div><span class="pill">TAG ${day()}</span></div><div class="muted">${PHASES[cp].task}</div><div class="progress"><span style="width:${Math.round(((day()-phaseStart(cp)+1)/6)*100)}%"></span></div></section><section class="phase-list">${PHASES.map((p,i)=>`<article class="card phase ${i===cp?'active':''} ${i>cp?'locked':''}"><div class="phase-num">${i+1}</div><div><div class="phase-title">${p.title}</div><small>${i>cp?'Öffnet an Tag '+phaseStart(i):p.sub}</small></div><span class="pill">${i>cp?'GESPERRT':i===cp?'AKTIV':'ERLEDIGT'}</span></article>`).join('')}</section>`}
function renderPatterns(){const n=Math.min(8,S.events.length);document.getElementById('patterns').innerHTML=`${brand()}<header class="head"><div class="kicker">Muster</div><h1>Dein Rauchmuster.</h1><div class="muted">Erst Daten sammeln, dann Muster behaupten.</div></header><section class="card stack"><div class="row"><div class="kicker">Kalibrierung</div><h2>${n}/8</h2></div><div class="progress"><span style="width:${n/8*100}%"></span></div><div class="pattern-grid"><article class="pattern"><svg viewBox="0 0 24 24"><path d="m13 2-7 11h6l-1 9 7-12h-6z"/></svg><b>Trigger</b><small>${esc(topTrigger())}</small></article><article class="pattern"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg><b>Zeitfenster</b><small>${S.events.length<8?'Noch nicht belastbar':'Aus deinen letzten Situationen'}</small></article><article class="pattern"><svg viewBox="0 0 24 24"><path d="M5 20v-5M12 20V9M19 20V4"/></svg><b>Intensität</b><small>${avgIntensity()}</small></article><article class="pattern"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg><b>Kontext</b><small>${S.events.length<8?'Noch nicht belastbar':'Situationen werden verknüpft'}</small></article></div></section>`}
function last7(){return[6,5,4,3,2,1,0].map(o=>{const d=new Date();d.setDate(d.getDate()-o);const k=d.toDateString();return S.events.filter(e=>new Date(e.ts).toDateString()===k).length})}
function renderProgress(){const v=last7(),m=Math.max(1,...v);document.getElementById('progress').innerHTML=`${brand()}<header class="head"><div class="kicker">Fortschritt</div><h1>Kontrolle statt Erfolgsserien.</h1><div class="muted">Mehr Wahlmöglichkeit, nicht perfekte Tage.</div></header><section class="card"><div class="kicker">Kontrollwert</div><div class="row" style="margin-top:10px;align-items:flex-end"><div><div class="score">${score()}</div><div class="muted">aus deinen letzten Situationen</div></div><span class="pill">Referenz ${S.baseline}/Tag</span></div></section><section class="stats-grid"><article class="stat"><div class="kicker">Unterbrechungen</div><strong>${S.events.filter(e=>e.type==='resist').length}</strong></article><article class="stat"><div class="kicker">Erfasst</div><strong>${S.events.length}</strong></article><article class="stat"><div class="kicker">Heute</div><strong>${todayEvents().length}</strong></article><article class="stat"><div class="kicker">Tag</div><strong>${day()}</strong></article></section><section class="card stack"><div class="kicker">7-Tage-Trend</div><div class="chart">${v.map((x,i)=>`<div class="chart-col"><div class="bar ${i===6?'today':''}" style="height:${Math.max(7,Math.round(x/m*62))}px"></div><small>${i===6?'Heute':6-i+'T'}</small></div>`).join('')}</div></section>`}
function renderMe(){document.getElementById('me').innerHTML=`${brand()}<header class="head"><div class="kicker">Ich</div><h1>Deine Einstellungen.</h1><div class="muted">Alles lokal auf diesem Gerät.</div></header><section class="card settings">${setting('Name',S.name||'Nicht gesetzt')}${setting('Ziel',S.goal==='quit'?'Aufhören':'Reduzieren')}${setting('Ausgangswert',S.baseline+' Zigaretten / Tag')}${setting('Programm','Tag '+day()+' · Phase '+(phase()+1))}</section><button class="btn white" data-edit>Profil bearbeiten</button><button class="btn white danger" data-reset>App zurücksetzen</button>`}
function renderOnboarding(){const o=document.getElementById('onboarding');o.classList.add('open');o.innerHTML=`<div class="onboarding-inner">${brand()}<header class="head"><div class="kicker">Smoke Lab</div><h1>Verstehe den Trigger.<br>Unterbrich das Muster.</h1><div class="muted">Kurzes Setup — deine Daten bleiben lokal auf deinem Gerät.</div></header><section class="card stack"><label class="kicker">Dein Vorname</label><input id="setupName" class="input" placeholder="Vorname" value="${esc(S.name)}"><label class="kicker">Zigaretten pro Tag</label><input id="setupBaseline" class="input" type="number" min="1" max="80" inputmode="numeric" value="${S.baseline}"><label class="kicker">Dein Ziel</label><div class="goal-grid"><button class="goal ${S.goal==='quit'?'active':''}" data-goal="quit">Aufhören</button><button class="goal ${S.goal==='reduce'?'active':''}" data-goal="reduce">Reduzieren</button></div></section><button class="btn orange" data-start>Labor starten</button></div>`}
function openSheet(html){const sh=document.getElementById('sheet');sh.innerHTML=`<div class="handle"></div>${html}`;document.getElementById('backdrop').classList.add('open');requestAnimationFrame(()=>sh.classList.add('open'));document.body.style.overflow='hidden'}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('backdrop').classList.remove('open');document.body.style.overflowY='auto'}
function openLog(){logDraft={type:'smoke',trigger:'Stress',intensity:3};openSheet(`<div class="sheet-head"><div><div class="kicker">Erfassen</div><h2>Was ist passiert?</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><div class="segmented"><button class="seg active" data-type="smoke">Geraucht</button><button class="seg" data-type="resist">Widerstanden</button></div><div><div class="kicker" style="margin-bottom:8px">Trigger</div><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger ${t==='Stress'?'active':''}" data-trigger="${esc(t)}">${esc(t)}</button>`).join('')}</div></div><div><div class="row"><div class="kicker">Stärke</div><b id="intVal">3/5</b></div><input id="intRange" class="range" type="range" min="1" max="5" value="3"></div><button class="btn orange" data-save-log>Speichern</button></div>`)}
function openSos(){sosTrigger=null;openSheet(`<div class="sheet-head"><div><div class="kicker">SOS</div><h2>Was drückt gerade?</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger" data-sos-trigger="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`)}
function showSos(t){sosTrigger=t;const text={Stress:'Wechsle kurz Ort oder Körperposition. Unterbrich nur den Ablauf — nicht dich selbst.',Kaffee:'Stell den Kaffee kurz weg, trink Wasser und nimm ihn an einem anderen Platz wieder auf.',Gewohnheit:'Verändere einen kleinen Teil der Reihenfolge: Ort, Hand oder nächste Handlung.',Pause:'Mach die Pause weiter — aber besetze sie für einen Moment anders.', 'Nach dem Essen':'Steh direkt auf, trink Wasser und ändere den Übergang nach dem Essen.',Gesellschaft:'Bleib kurz bei der Gruppe, ändere Platz oder Gespräch und entscheide danach neu.'}[t];openSheet(`<div class="sheet-head"><div><div class="kicker">${esc(t)}</div><h2>Autopilot unterbrechen.</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><div class="muted">${esc(text)}</div></section><button class="btn petrol" data-sos-done>Drang ist gesunken</button><button class="btn white" data-close>Für jetzt schließen</button></div>`)}
function record(type,trigger,intensity=3){S.events.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),ts:Date.now(),type,trigger,intensity:Number(intensity)});save();render()}
function openEdit(){openSheet(`<div class="sheet-head"><div><div class="kicker">Profil</div><h2>Daten bearbeiten</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><label class="kicker">Name</label><input id="editName" class="input" value="${esc(S.name)}"><label class="kicker">Ausgangswert</label><input id="editBaseline" class="input" type="number" min="1" max="80" value="${S.baseline}"><div class="kicker">Ziel</div><div class="goal-grid"><button class="goal ${S.goal==='quit'?'active':''}" data-edit-goal="quit">Aufhören</button><button class="goal ${S.goal==='reduce'?'active':''}" data-edit-goal="reduce">Reduzieren</button></div><button class="btn petrol" data-save-profile>Speichern</button></div>`)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
function switchTab(tab){S.activeTab=tab;save();render();window.scrollTo({top:0,left:0,behavior:'auto'})}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){switchTab(nav.dataset.tab);return}if(e.target.closest('[data-open-log]')){openLog();return}if(e.target.closest('[data-open-sos]')){openSos();return}if(e.target.closest('[data-close]')){closeSheet();return}const ty=e.target.closest('[data-type]');if(ty){logDraft.type=ty.dataset.type;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b===ty));return}const tr=e.target.closest('[data-trigger]');if(tr){logDraft.trigger=tr.dataset.trigger;document.querySelectorAll('[data-trigger]').forEach(b=>b.classList.toggle('active',b===tr));return}if(e.target.closest('[data-save-log]')){record(logDraft.type,logDraft.trigger,logDraft.intensity);closeSheet();toast(logDraft.type==='resist'?'Unterbrechung gespeichert':'Situation gespeichert');return}const st=e.target.closest('[data-sos-trigger]');if(st){showSos(st.dataset.sosTrigger);return}if(e.target.closest('[data-sos-done]')){record('resist',sosTrigger||'Unbekannt',3);closeSheet();toast('Drang unterbrochen');return}const g=e.target.closest('[data-goal]');if(g){S.goal=g.dataset.goal;save();renderOnboarding();return}if(e.target.closest('[data-start]')){const name=document.getElementById('setupName').value.trim();const base=Number(document.getElementById('setupBaseline').value);S.name=name||'Daniel';S.baseline=Math.min(80,Math.max(1,base||10));S.onboarded=true;S.startedAt=Date.now();S.activeTab='today';save();render();window.scrollTo(0,0);return}if(e.target.closest('[data-edit]')){openEdit();return}const eg=e.target.closest('[data-edit-goal]');if(eg){S.goal=eg.dataset.editGoal;document.querySelectorAll('[data-edit-goal]').forEach(b=>b.classList.toggle('active',b===eg));return}if(e.target.closest('[data-save-profile]')){S.name=document.getElementById('editName').value.trim()||S.name;S.baseline=Math.min(80,Math.max(1,Number(document.getElementById('editBaseline').value)||10));save();closeSheet();render();toast('Profil gespeichert');return}if(e.target.closest('[data-reset]')){if(confirm('Smoke Lab wirklich zurücksetzen? Alle lokal gespeicherten Daten werden gelöscht.')){localStorage.removeItem(KEY);S=fresh();closeSheet();render();window.scrollTo(0,0)}return}})
document.addEventListener('input',e=>{if(e.target.id==='intRange'){logDraft.intensity=Number(e.target.value);const x=document.getElementById('intVal');if(x)x.textContent=logDraft.intensity+'/5'}})
document.getElementById('backdrop').addEventListener('click',closeSheet);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
</script>
</body>
</html>
