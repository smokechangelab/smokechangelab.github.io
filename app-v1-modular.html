<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F5F4"><title>Smoke Lab</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./css/system.css"></head><body><div class="app"><header class="header"><div class="brand">◒ SMOKE LAB</div><button id="sosBtn" class="sos" type="button">SOS</button></header><main><section id="welcome" class="screen"><div class="card"><div class="eyebrow">VERHALTENSLABOR</div><h1 class="title" style="font-size:30px">Muster statt Moral.</h1><p class="muted">Erkenne, wann und wofür du rauchst, teste passende Gegenstrategien und lerne aus ihrer Wirkung.</p><button id="startBtn" class="btn primary" style="width:100%;margin-top:12px">Jetzt starten</button></div></section><section id="onboarding" class="screen"><div id="onboardingCard" class="card"></div></section><section id="home" class="screen"><div id="status" class="status"></div><div class="grid2"><button id="cravingBtn" class="btn quick primary">Craving Stopper<small>Akuthilfe</small></button><button id="smokeBtn" class="btn quick">Zigarette erfassen<small>Micro-Journal</small></button></div><div id="radar" class="card"></div></section><section id="patterns" class="screen"><div id="patternsCard" class="card"></div></section><section id="experiment" class="screen"><div id="experimentCard" class="card"></div></section><section id="settings" class="screen"><div id="settingsCard" class="card"></div></section></main></div><nav id="bottomNav" class="bottom-nav" aria-label="Hauptnavigation"><button class="tab" data-view="home">Home</button><button class="tab" data-view="patterns">Muster</button><button class="tab" data-view="experiment">Experiment</button><button class="tab" data-view="settings">Einstellungen</button></nav><dialog id="journalDialog" class="modal"><div class="sheet"><div class="sheet-head"><span id="journalStep" class="eyebrow
