<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<link rel="manifest" href="/manifest.webmanifest">

<title>Smoke Lab</title>
<style>
:root{--bg:#F4F5F7;--card:#fff;--primary:#0F2E2C;--accent:#FF6B35;--muted:#707885;--label:#8E8E93;--line:rgba(0,0,0,.035);--soft:#F0F4F2;--shadow:0 12px 40px rgba(0,0,0,.04);--r:26px;--rb:17px}*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg);scroll-behavior:smooth}body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--primary);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-y:auto}button,input{font:inherit}.app{width:100%;max-width:414px;min-height:100vh;margin:0 auto;position:relative}.view{display:none;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(122px + env(safe-area-inset-bottom));flex-direction:column;gap:13px}.view.active{display:flex}.brand{display:flex;align-items:center;gap:10px;min-height:38px}.logo{width:31px;height:31px;display:grid;grid-template-columns:1fr 1fr;gap:3px}.logo i{display:block;background:var(--primary)}.logo i:nth-child(1){border-radius:11px 3px 11px 3px}.logo i:nth-child(2){border-radius:50%;background:var(--accent)}.logo i:nth-child(3){border-radius:3px 11px 3px 11px}.logo i:nth-child(4){border-radius:11px 3px 11px 3px}.brand strong{font-size:17px;letter-spacing:.3px}.head{display:flex;flex-direction:column;gap:4px;margin-top:1px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.85px;font-weight:800;color:var(--label)}h1{font-size:26px;line-height:1.04;letter-spacing:-.8px;font-weight:850}h2{font-size:19px;line-height:1.1;letter-spacing:-.4px;font-weight:800}.muted{font-size:14px;line-height:1.4;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero{position:relative;overflow:hidden;min-height:126px;background:linear-gradient(135deg,#0F2E2C 0%,#154944 100%);color:#fff}.hero:after{content:"";position:absolute;inset:auto -26px -55px auto;width:220px;height:115px;border-radius:55% 45% 0 0;background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,.09));transform:rotate(-7deg)}.hero h2{color:#fff;font-size:23px}.hero .kicker,.hero .muted{color:rgba(255,255,255,.68)}.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.14) 0);position:relative;z-index:2}.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#174A45}.ring span{position:relative;z-index:1;color:#fff;font-size:11px;font-weight:800}.actions{display:grid;gap:9px}.btn{height:56px;border:0;border-radius:var(--rb);padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;white-space:nowrap;cursor:pointer;transition:transform .12s ease}.btn:active{transform:scale(.985)}.btn.orange{background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(255,107,53,.22)}.btn.petrol{background:var(--primary);color:#fff}.btn.white{background:#fff;color:var(--primary);border:1px solid var(--line);box-shadow:var(--shadow)}.metricgrid,.pattern-grid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric,.tile,.stat{background:linear-gradient(145deg,#FBFCFD,#F5F7F8);border:1px solid rgba(15,46,44,.05);border-radius:18px;padding:13px}.metric{min-height:82px}.metric strong,.stat strong{display:block;margin-top:9px;font-size:27px;line-height:1}.datarow{min-height:38px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}.datarow:first-child{border-top:0}.datarow span:first-child{color:var(--muted)}.datarow b{font-size:13px;max-width:64%;text-align:right}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:10px;font-weight:800;white-space:nowrap}.progress{height:6px;border-radius:999px;background:#E7ECEA;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary);border-radius:999px}.phase-list{display:grid;gap:8px}.phase{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:66px}.phase.locked{opacity:.48;box-shadow:none}.phase.active{border-color:rgba(15,46,44,.18)}.phase-num{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:850}.phase-title{font-size:14px;font-weight:800}.phase small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}.tile{min-height:100px}.tile .ico{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:9px;font-size:17px}.tile b{font-size:13px}.tile small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.score{font-size:50px;font-weight:850;line-height:.9;letter-spacing:-2px}.stat{min-height:88px}.chart{height:95px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}.chartcol{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}.bar{width:23px;min-height:7px;border-radius:7px 7px 3px 3px;background:#BCD4C8}.bar.today{background:var(--primary)}.chartcol small{font-size:9px;color:var(--muted)}.settings{padding:3px 16px}.setting{min-height:58px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:14px}.setting:first-child{border-top:0}.setting b{font-size:13px}.setting span{font-size:13px;color:var(--muted);max-width:60%;text-align:right}.bottom-nav{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;width:min(calc(100% - 18px),396px);height:70px;border-radius:25px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 15px 40px rgba(15,46,44,.1)}.nav-item{border:0;background:transparent;border-radius:19px;color:#7A8492;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:700;white-space:nowrap}.nav-item.active{color:var(--primary);background:rgba(15,46,44,.07)}.nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.backdrop{position:fixed;inset:0;z-index:200;display:none;background:rgba(15,23,42,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.backdrop.open{display:block}.sheet{position:fixed;left:50%;bottom:0;z-index:210;width:100%;max-width:414px;max-height:88dvh;overflow:auto;background:#fff;border-radius:32px 32px 0 0;padding:12px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -24px 60px rgba(0,0,0,.16);transform:translate(-50%,110%);transition:transform .32s cubic-bezier(.22,.9,.25,1)}.sheet.open{transform:translate(-50%,0)}.handle{width:38px;height:4px;border-radius:999px;background:#D6D8DB;margin:0 auto 13px}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}.close{width:32px;height:32px;border:0;border-radius:50%;background:#F0F2F3;color:var(--primary);font-size:20px}.sheet-stack{display:grid;gap:12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:#F1F3F4}.seg button{height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:750}.seg button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06)}.trigger-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.trigger{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--primary);font-size:12px;font-weight:800}.trigger.active{background:var(--primary);color:#fff}.range{width:100%;accent-color:var(--primary)}.input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 13px;background:#FAFBFC;color:var(--primary);font-size:15px;outline:none}.input:focus{background:#fff;border-color:rgba(15,46,44,.26);box-shadow:0 0 0 3px rgba(15,46,44,.06)}.onboarding{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;background:var(--bg)}.onboarding.open{display:block}.onboarding-inner{width:100%;max-width:414px;min-height:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.goal{height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--primary);font-weight:800}.goal.active{background:var(--primary);color:#fff}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:250;transform:translate(-50%,12px);opacity:0;background:var(--primary);color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:360px){.view{padding-left:12px;padding-right:12px}h1{font-size:23px}.btn{font-size:14px}.bottom-nav{width:calc(100% - 10px)}}
</style>
</head>
<body>
<div class="app"><main id="today" class="view active"></main><main id="lab" class="view"></main><main id="patterns" class="view"></main><main id="progress" class="view"></main><main id="me" class="view"></main></div>
<nav class="bottom-nav" id="bottomNav">
<button class="nav-item active" data-tab="today" aria-label="Heute"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg><span>HEUTE</span></button>
<button class="nav-item" data-tab="lab" aria-label="Labor"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8"/></svg><span>LABOR</span></button>
<button class="nav-item" data-tab="patterns" aria-label="Muster"><svg viewBox="0 0 24 24"><path d="M5 20v-5M12 20V9M19 20V4"/></svg><span>MUSTER</span></button>
<button class="nav-item" data-tab="progress" aria-label="Fortschritt"><svg viewBox="0 0 24 24"><path d="m4 17 5-6 4 3 7-9M16 5h4v4"/></svg><span>FORTSCHRITT</span></button>
<button class="nav-item" data-tab="me" aria-label="Ich"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>ICH</span></button>
</nav>
<div id="backdrop" class="backdrop"></div><section id="sheet" class="sheet" aria-modal="true"></section><section id="onboarding" class="onboarding"></section><div id="toast" class="toast"></div>
<script>
const KEY='smokeLab.v61';
const TRIGGERS=['Stress','Kaffee','Gewohnheit','Pause','Nach dem Essen','Gesellschaft'];
const PHASES=[
{title:'Beobachten',sub:'Muster sichtbar machen',task:'Heute zwei Situationen erfassen – ohne sie bewerten zu müssen.',goal:'Erkennen, wann und wodurch dein Rauch-Autopilot startet.',experiments:[['bewusst','Bewusste Zigarette','Eine Situation bewusst beobachten und neutral erfassen.','log'],['kaffee','Kaffee-Test','Beim nächsten Kaffee Trigger und Stärke dokumentieren.','log'],['morgen','Morning Check','Den ersten deutlichen Drang des Tages bewusst erfassen.','log']]},
{title:'Unterbrechen',sub:'Autopilot stören',task:'Heute mindestens einmal einen Drang bewusst unterbrechen.',goal:'Zwischen Trigger und Reaktion einen Entscheidungsraum schaffen.',experiments:[['delay','3-Minuten-Delay','Reaktion kurz verschieben und danach neu entscheiden.','sos'],['ort','Ort wechseln','Beim Trigger bewusst den Ort wechseln.','sos'],['meal','After-Meal Reset','Nach dem Essen zuerst Wasser oder Ortswechsel.','sos']]},
{title:'Entkoppeln',sub:'Trigger lösen',task:'Heute einen bekannten Trigger absichtlich anders beantworten.',goal:'Gewohnte Auslöser Schritt für Schritt von der Zigarette trennen.',experiments:[['coffee2','Coffee Breaker','Kaffee bewusst an einem anderen Ort trinken.','sos'],['hands','Hands Busy','Die Hände kurz anders beschäftigen.','sos'],['work','Work-Break Test','Eine Arbeitspause ohne automatische Zigarette testen.','sos']]},
{title:'Ersetzen',sub:'Neue Antworten testen',task:'Heute bewusst eine neue Antwort auf einen Trigger testen.',goal:'Für häufige Trigger passende Alternativen entwickeln.',experiments:[['water','Wasser-Reset','Bei einem Drang zuerst Wasser holen.','sos'],['walk','Micro-Walk','Ein paar Schritte gehen und danach neu entscheiden.','sos'],['switch','Routine Switch','Einen festen Ablauf gezielt verändern.','sos']]},
{title:'Stabilisieren',sub:'Kontrolle festigen',task:'Heute deine bisher stärkste Strategie erneut einsetzen.',goal:'Die wirksamsten Unterbrechungen gezielt wiederholen.',experiments:[['best','Best Strategy','Deine stärkste Unterbrechung wiederholen.','sos'],['risk','Risk Window','Ein typisches Risikofenster bewusst vorbereiten.','sos'],['choice','Conscious Choice','Vor einer Entscheidung kurz Trigger und Ziel prüfen.','log']]}
];
const SOS={Stress:['Druck unterbrechen','Lockere kurz Kiefer und Schultern. Wechsel den Ort oder geh ein paar Schritte.'],Kaffee:['Ritual trennen','Stell den Kaffee kurz weg, trink Wasser und nimm ihn an einem anderen Platz wieder auf.'],Gewohnheit:['Autopilot stören','Verändere nur einen Teil der Reihenfolge: Ort, Hand oder nächste Handlung.'],Pause:['Pause neu besetzen','Steh kurz auf und beschäftige deine Hände für einen Moment anders.'],'Nach dem Essen':['Übergang verändern','Steh direkt auf, trink Wasser und wechsel kurz den Raum.'],Gesellschaft:['Sozialen Sog lösen','Wechsel Gespräch oder Platz und entscheide danach neu.']};
const init=()=>({name:'',baseline:10,goal:'quit',startedAt:Date.now(),activeTab:'today',onboarding:false,events:[],done:[],activeExperiment:null});
let state=load(),logDraft={type:'smoke',trigger:'Stress',intensity:3},sosTrigger=null;
function load(){try{return {...init(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return init()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(){return Math.max(1,Math.min(30,Math.floor((Date.now()-state.startedAt)/86400000)+1))}
function phaseIndex(){return Math.min(4,Math.floor((day()-1)/6))}
function phaseStart(i){return i*6+1}
function greeting(){let h=new Date().getHours();return h<11?'Guten Morgen':h>=18?'Guten Abend':'Guten Tag'}
function todayEvents(){let k=new Date().toDateString();return state.events.filter(e=>new Date(e.t).toDateString()===k)}
function smoked(){return todayEvents().filter(e=>e.type==='smoke').length}
function resisted(){return todayEvents().filter(e=>e.type==='resist').length}
function total(type){return state.events.filter(e=>e.type===type).length}
function score(){let a=state.events.slice(-20);if(!a.length)return 50;return Math.round(a.reduce((s,e)=>s+(e.type==='resist'?100:Math.max(20,80-(e.intensity||3)*10)),0)/a.length)}
function topTrigger(){if(state.events.length<8)return'Noch nicht belastbar';let m={};state.events.forEach(e=>{if(e.trigger)m[e.trigger]=(m[e.trigger]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Noch nicht belastbar'}
function completed(i){return PHASES[i].experiments.filter(x=>state.done.includes(x[0])).length}
function brand(){return `<div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div><strong>SMOKE LAB</strong></div>`}
function render(){renderToday();renderLab();renderPatterns();renderProgress();renderMe();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===state.activeTab));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.activeTab));if(!state.onboarding)renderOnboarding();else document.getElementById('onboarding').classList.remove('open')}
function renderToday(){let i=phaseIndex(),p=PHASES[i],s=score();today.innerHTML=`${brand()}<header class="head"><div class="kicker">Heute · Tag ${day()}</div><h1>${greeting()}${state.name?', '+esc(state.name):''}</h1><div class="muted">Verstehe den Trigger. Unterbrich das Muster.</div></header><section class="card hero"><div class="row" style="align-items:flex-start"><div><div class="kicker">Phase ${i+1}</div><h2>${p.title}</h2><div class="muted" style="margin-top:8px">${p.sub}</div></div><div class="ring" style="--p:${s}"><span>${s}</span></div></div></section><section class="actions"><button class="btn orange" data-open-log>+ Zigarette / Widerstand erfassen</button><button class="btn petrol" data-open-sos>Drang stoppen (SOS)</button></section><section class="card stack"><div><div class="kicker">Tages-Radar</div><h2 style="margin-top:2px">Heute auf einen Blick</h2></div><div class="metricgrid"><div class="metric"><div class="kicker">Zigaretten</div><strong>${smoked()}</strong></div><div class="metric"><div class="kicker">Unterbrechungen</div><strong>${resisted()}</strong></div></div><div><div class="datarow"><span>Muster</span><b>${esc(topTrigger())}</b></div><div class="datarow"><span>Labor</span><b>${completed(i)}/3 Experimente</b></div></div></section>`}
function renderLab(){let i=phaseIndex(),p=PHASES[i],d=completed(i);lab.innerHTML=`${brand()}<header class="head"><div class="kicker">Labor · 30-Tage-Programm</div><h1>Trainiere Kontrolle.</h1><div class="muted">Neue Phasen öffnen sich erst, wenn du zeitlich dort angekommen bist.</div></header><section class="card stack"><div class="row" style="align-items:flex-start"><div><div class="kicker">Aktuelle Phase</div><h2>${p.title}</h2></div><span class="pill">TAG ${day()}</span></div><div class="muted">${p.task}</div><div class="progress"><i style="width:${d/3*100}%"></i></div><div class="muted">${d}/3 Experimente abgeschlossen</div></section><section class="phase-list">${PHASES.map((x,n)=>{let locked=n>i,active=n===i;return `<article class="card phase ${locked?'locked':''} ${active?'active':''}" ${locked?'':`data-phase="${n}"`}><div class="phase-num">${n+1}</div><div><div class="phase-title">${x.title}</div><small>${locked?`Öffnet an Tag ${phaseStart(n)}`:x.sub}</small></div><span class="pill">${locked?'GESPERRT':active?'AKTIV':completed(n)+'/3'}</span></article>`}).join('')}</section>`}
function patternBox(icon,title,text){return `<article class="tile"><div class="ico">${icon}</div><b>${title}</b><small>${esc(text)}</small></article>`}
function avgIntensity(){if(!state.events.length)return'Noch nicht belastbar';return (state.events.reduce((s,e)=>s+(e.intensity||3),0)/state.events.length).toFixed(1)+' / 5'}
function timeWindow(){if(state.events.length<8)return'Noch nicht belastbar';let g={Morgen:0,Mittag:0,Nachmittag:0,Abend:0};state.events.forEach(e=>{let h=new Date(e.t).getHours();if(h<11)g.Morgen++;else if(h<14)g.Mittag++;else if(h<18)g.Nachmittag++;else g.Abend++});return Object.entries(g).sort((a,b)=>b[1]-a[1])[0][0]}
function renderPatterns(){let n=state.events.length,c=Math.min(n,8);patterns.innerHTML=`${brand()}<header class="head"><div class="kicker">Muster</div><h1>Dein Rauchmuster.</h1><div class="muted">Erst Daten sammeln, dann Muster behaupten.</div></header><section class="card stack"><div class="row"><div class="kicker">Kalibrierung</div><h2>${c}/8</h2></div><div class="progress"><i style="width:${c/8*100}%"></i></div><div class="pattern-grid">${patternBox('⚡','Trigger',n>=8?topTrigger():'Noch nicht belastbar')}${patternBox('◷','Zeitfenster',n>=8?timeWindow():'Noch nicht belastbar')}${patternBox('▥','Intensität',n>=8?avgIntensity():'Noch nicht belastbar')}${patternBox('◎','Kontext',n>=8?'Aus deinen Situationen':'Noch nicht belastbar')}</div></section>`}
function sevenDays(){return [6,5,4,3,2,1,0].map(off=>{let d=new Date();d.setDate(d.getDate()-off);let k=d.toDateString();return state.events.filter(e=>new Date(e.t).toDateString()===k).length})}
function stat(label,value){return `<article class="stat"><div class="kicker">${label}</div><strong>${value}</strong></article>`}
function renderProgress(){let vals=sevenDays(),max=Math.max(1,...vals),s=score();progress.innerHTML=`${brand()}<header class="head"><div class="kicker">Fortschritt</div><h1>Kontrolle statt Erfolgsserien.</h1><div class="muted">Mehr Wahlmöglichkeit, nicht perfekte Tage.</div></header><section class="card hero"><div class="row" style="align-items:flex-end"><div><div class="kicker">Kontrollwert</div><div class="score">${s}</div><div class="muted">aus deinen letzten Situationen</div></div><span class="pill" style="background:rgba(255,255,255,.14);color:#fff">Referenz ${state.baseline}/Tag</span></div></section><section class="stats">${stat('Unterbrechungen',total('resist'))}${stat('Erfasst',total('smoke'))}${stat('Heute',smoked())}${stat('Labor',state.done.length)}</section><section class="card stack"><div class="kicker">7-Tage-Trend</div><div class="chart">${vals.map((v,i)=>`<div class="chartcol"><div class="bar ${i===6?'today':''}" style="height:${Math.max(7,Math.round(v/max*60))}px"></div><small>${i===6?'Heute':6-i+'T'}</small></div>`).join('')}</div></section>`}
function setting(label,value){return `<div class="setting"><b>${label}</b><span>${esc(value)}</span></div>`}
function renderMe(){me.innerHTML=`${brand()}<header class="head"><div class="kicker">Ich</div><h1>Deine Einstellungen.</h1><div class="muted">Alles lokal auf diesem Gerät.</div></header><section class="card settings">${setting('Name',state.name||'Nicht gesetzt')}${setting('Ziel',state.goal==='quit'?'Aufhören':'Reduzieren')}${setting('Ausgangswert',state.baseline+' Zigaretten / Tag')}${setting('Programm','Tag '+day()+' · Phase '+(phaseIndex()+1))}</section><button class="btn white" data-edit>Profil bearbeiten</button><button class="btn white" style="color:#B43A3A" data-reset>App zurücksetzen</button>`}
function renderOnboarding(){let o=document.getElementById('onboarding');o.classList.add('open');o.innerHTML=`<div class="onboarding-inner">${brand()}<header class="head"><div class="kicker">Smoke Lab</div><h1>Verstehe den Trigger. Unterbrich das Muster.</h1><div class="muted">Kurzes Setup – deine Daten bleiben lokal auf deinem Gerät.</div></header><section class="card stack"><label class="kicker">Dein Vorname</label><input id="onName" class="input" value="${esc(state.name)}" placeholder="Vorname"><label class="kicker">Zigaretten pro Tag</label><input id="onBase" class="input" type="number" min="1" max="80" value="${state.baseline}"><label class="kicker">Dein Ziel</label><div class="goal-grid"><button class="goal ${state.goal==='quit'?'active':''}" data-goal="quit">Aufhören</button><button class="goal ${state.goal==='reduce'?'active':''}" data-goal="reduce">Reduzieren</button></div></section><button class="btn petrol" data-start>Smoke Lab starten</button></div>`}
function openSheet(html){sheet.innerHTML=`<div class="handle"></div>${html}`;backdrop.classList.add('open');requestAnimationFrame(()=>sheet.classList.add('open'));document.body.style.overflow='hidden'}
function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open');document.body.style.overflowY='auto'}
function openLog(){logDraft={type:'smoke',trigger:'Stress',intensity:3};openSheet(`<div class="sheet-head"><div><div class="kicker">Erfassen</div><h2>Was ist passiert?</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><div class="seg"><button class="active" data-log-type="smoke">Geraucht</button><button data-log-type="resist">Widerstanden</button></div><div><div class="kicker" style="margin-bottom:8px">Trigger</div><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger ${t==='Stress'?'active':''}" data-log-trigger="${t}">${t}</button>`).join('')}</div></div><div><div class="row"><div class="kicker">Stärke</div><b id="intensityOut">3/5</b></div><input id="intensity" class="range" type="range" min="1" max="5" value="3"></div><button class="btn orange" data-save-log>Speichern</button></div>`)}
function saveLog(){state.events.push({id:Date.now()+Math.random(),t:Date.now(),type:logDraft.type,trigger:logDraft.trigger,intensity:+logDraft.intensity});completeActiveExperiment();save();render();success(logDraft.type==='resist'?'Unterbrechung gespeichert':'Situation gespeichert','Deine Muster und dein Fortschritt wurden aktualisiert.')}
function openSOS(){sosTrigger=null;openSheet(`<div class="sheet-head"><div><div class="kicker">SOS</div><h2>Was drückt gerade?</h2></div><button class="close" data-close>×</button></div><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger" data-sos="${t}">${t}</button>`).join('')}</div>`)}
function sosStep(t){sosTrigger=t;let x=SOS[t];openSheet(`<div class="sheet-head"><div><div class="kicker">${esc(t)}</div><h2>${x[0]}</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><div class="muted" style="color:var(--primary)">${x[1]}</div></section><button class="btn petrol" data-sos-lower>Gesunken</button><button class="btn white" data-sos-still>Noch da</button></div>`)}
function sosSuccess(){state.events.push({id:Date.now()+Math.random(),t:Date.now(),type:'resist',trigger:sosTrigger||'Unbekannt',intensity:3});completeActiveExperiment();save();render();success('Drang unterbrochen','Du hast den Autopiloten gerade bewusst unterbrochen.')}
function secondSOS(){openSheet(`<div class="sheet-head"><div><div class="kicker">Zweiter Schritt</div><h2>Verändere den Kontext.</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><div class="muted" style="color:var(--primary)">Wechsel jetzt bewusst Ort, Körperposition oder Tätigkeit. Du musst nichts verbieten – nur den automatischen Ablauf stören.</div></section><button class="btn petrol" data-sos-lower>Gesunken</button><button class="btn white" data-close>Für jetzt schließen</button></div>`)}
function success(title,text){openSheet(`<div style="text-align:center;padding:8px 0 12px"><div style="width:50px;height:50px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 9px;font-size:22px;font-weight:900">✓</div><h2>${title}</h2><div class="muted" style="margin-top:6px">${text}</div></div><button class="btn petrol" data-close>Fertig</button>`)}
function completeActiveExperiment(){if(state.activeExperiment&&!state.done.includes(state.activeExperiment))state.done.push(state.activeExperiment);state.activeExperiment=null}
function phaseSheet(i){if(i>phaseIndex())return;let p=PHASES[i],current=i===phaseIndex();openSheet(`<div class="sheet-head"><div><div class="kicker">Phase ${i+1}</div><h2>${p.title}</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card stack"><div><div class="kicker">Ziel</div><div class="muted" style="margin-top:5px;color:var(--primary)">${p.goal}</div></div>${current?`<div><div class="kicker">Heute</div><div class="muted" style="margin-top:5px;color:var(--primary)">${p.task}</div></div>`:`<div class="muted">Diese Phase liegt bereits hinter dir.</div>`}</section><div><div class="kicker" style="margin-bottom:8px">Experimente</div><div class="sheet-stack">${p.experiments.map(e=>{let done=state.done.includes(e[0]);return `<section class="card row"><div><b style="font-size:13px">${e[1]}</b><div class="muted" style="font-size:11px;margin-top:3px">${e[2]}</div></div>${done?'<span class="pill">✓</span>':current?`<button class="pill" style="border:0" data-exp="${e[0]}" data-mode="${e[3]}">Starten</button>`:'<span class="pill">offen</span>'}</section>`}).join('')}</div></div></div>`)}
function startExp(id,mode){state.activeExperiment=id;save();mode==='sos'?openSOS():openLog()}
function editProfile(){openSheet(`<div class="sheet-head"><div><div class="kicker">Profil</div><h2>Daten bearbeiten</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><label class="kicker">Name</label><input id="pName" class="input" value="${esc(state.name)}"><label class="kicker">Ausgangswert</label><input id="pBase" class="input" type="number" min="1" max="80" value="${state.baseline}"><div class="kicker">Ziel</div><div class="goal-grid"><button class="goal ${state.goal==='quit'?'active':''}" data-pgoal="quit">Aufhören</button><button class="goal ${state.goal==='reduce'?'active':''}" data-pgoal="reduce">Reduzieren</button></div><button class="btn petrol" data-save-profile>Änderungen speichern</button></div>`)}
function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),1500)}
function switchTab(t){state.activeTab=t;save();render();window.scrollTo({top:0,left:0,behavior:'instant'})}
document.addEventListener('click',e=>{let x=e.target.closest('.nav-item');if(x)return switchTab(x.dataset.tab);if(e.target.closest('[data-open-log]'))return openLog();if(e.target.closest('[data-open-sos]'))return openSOS();if(e.target.closest('[data-close]'))return closeSheet();x=e.target.closest('[data-log-type]');if(x){logDraft.type=x.dataset.logType;document.querySelectorAll('[data-log-type]').forEach(b=>b.classList.toggle('active',b===x));return}x=e.target.closest('[data-log-trigger]');if(x){logDraft.trigger=x.dataset.logTrigger;document.querySelectorAll('[data-log-trigger]').forEach(b=>b.classList.toggle('active',b===x));return}if(e.target.closest('[data-save-log]'))return saveLog();x=e.target.closest('[data-sos]');if(x)return sosStep(x.dataset.sos);if(e.target.closest('[data-sos-lower]'))return sosSuccess();if(e.target.closest('[data-sos-still]'))return secondSOS();x=e.target.closest('[data-phase]');if(x)return phaseSheet(+x.dataset.phase);x=e.target.closest('[data-exp]');if(x)return startExp(x.dataset.exp,x.dataset.mode);x=e.target.closest('[data-goal]');if(x){state.goal=x.dataset.goal;save();renderOnboarding();return}if(e.target.closest('[data-start]')){state.name=document.getElementById('onName').value.trim()||'Daniel';state.baseline=Math.min(80,Math.max(1,+document.getElementById('onBase').value||10));state.startedAt=Date.now();state.onboarding=true;state.activeTab='today';save();render();window.scrollTo(0,0);return}if(e.target.closest('[data-edit]'))return editProfile();x=e.target.closest('[data-pgoal]');if(x){state.goal=x.dataset.pgoal;document.querySelectorAll('[data-pgoal]').forEach(b=>b.classList.toggle('active',b===x));return}if(e.target.closest('[data-save-profile]')){state.name=document.getElementById('pName').value.trim()||state.name;state.baseline=Math.min(80,Math.max(1,+document.getElementById('pBase').value||10));save();closeSheet();render();toastMsg('Profil gespeichert');return}if(e.target.closest('[data-reset]')){if(confirm('Smoke Lab wirklich zurücksetzen? Alle lokal gespeicherten Daten werden gelöscht.')){localStorage.removeItem(KEY);state=init();render();window.scrollTo(0,0)}}});
document.addEventListener('input',e=>{if(e.target.id==='intensity'){logDraft.intensity=+e.target.value;let o=document.getElementById('intensityOut');if(o)o.textContent=logDraft.intensity+'/5'}});backdrop.addEventListener('click',closeSheet);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}render();
</script>
</body>
</html>
