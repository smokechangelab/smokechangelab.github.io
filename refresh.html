<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F5F4"><title>Smoke Lab aktualisieren</title><style>html,body{margin:0;min-height:100%;background:#F2F5F4;color:#1B4F4C;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,390px);background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:24px;box-sizing:border-box;box-shadow:0 8px 28px rgba(27,79,76,.08);text-align:center}.spinner{width:28px;height:28px;margin:0 auto 14px;border:3px solid #E2E8F0;border-top-color:#E8873A;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;line-height:1.5;color:#66736F;margin:0}</style></head><body><main><div class="card"><div class="spinner"></div><h1>Smoke Lab wird aktualisiert</h1><p id="status">Alte App-Caches werden entfernt …</p></div></main><script>(async()=>{const status=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}status.textContent='Fertig. Die aktuelle Version wird geladen …';}catch{status.textContent='Aktuelle Version wird geladen …';}const u=`./?fresh=${Date.now()}`;setTimeout(()=>location.replace(u),250);})();</script></body></html>
