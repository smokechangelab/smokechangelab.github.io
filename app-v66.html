<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Smoke Lab</title>
<style>
:root{--bg:#F2F4F7;--card:#FFFFFF;--petrol:#0F2E2C;--petrol2:#174944;--orange:#FF6B35;--muted:#77808D;--label:#8E8E93;--line:rgba(0,0,0,.035);--soft:#EEF3F1;--shadow:0 12px 40px rgba(0,0,0,.04);--r:26px;--rb:17px}*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg);scroll-behavior:smooth}body{min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;background:var(--bg);color:var(--petrol);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}.app{width:100%;max-width:414px;min-height:100vh;margin:0 auto;position:relative}.view{display:none;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(140px + env(safe-area-inset-bottom));flex-direction:column;gap:14px}.view.active{display:flex}.brand{display:flex;align-items:center;gap:10px;min-height:38px}.brand-mark{width:31px;height:31px;display:grid;grid-template-columns:1fr 1fr;gap:3px}.brand-mark i{display:block;background:var(--petrol)}.brand-mark i:nth-child(1){border-radius:11px 3px 11px 3px}.brand-mark i:nth-child(2){border-radius:50%;background:var(--orange)}.brand-mark i:nth-child(3){border-radius:3px 11px 3px 11px}.brand-mark i:nth-child(4){border-radius:11px 3px 11px 3px}.brand strong{font-size:17px;letter-spacing:.3px}.head{display:flex;flex-direction:column;gap:4px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:800;color:var(--label)}h1{font-size:26px;line-height:1.04;letter-spacing:-.8px;font-weight:850}h2{font-size:19px;line-height:1.1;letter-spacing:-.4px;font-weight:800}.muted{font-size:14px;line-height:1.4;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero{position:relative;overflow:hidden;min-height:128px;background:linear-gradient(135deg,var(--petrol) 0%,var(--petrol2) 100%);color:#fff}.hero:after{content:"";position:absolute;right:-36px;bottom:-62px;width:230px;height:126px;border-radius:55% 45% 0 0;background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,.09));transform:rotate(-8deg)}.hero h2{color:#fff;font-size:23px}.hero .kicker,.hero .muted{color:rgba(255,255,255,.7)}.score-pill{position:relative;z-index:2;min-width:72px;height:34px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;white-space:nowrap}.actions{display:grid;gap:9px}.btn{height:56px;border:0;border-radius:var(--rb);padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;white-space:nowrap;cursor:pointer;transition:transform .12s ease,opacity .12s ease}.btn:active{transform:scale(.985)}.btn.orange{background:linear-gradient(135deg,#FF845F 0%,var(--orange) 100%);color:#fff;box-shadow:0 10px 24px rgba(255,107,53,.23)}.btn.petrol{background:var(--petrol);color:#fff;box-shadow:0 10px 22px rgba(15,46,44,.13)}.btn.white{background:#fff;color:var(--petrol);border:1px solid var(--line);box-shadow:var(--shadow)}.btn.danger{color:#C94545}.metric-grid,.pattern-grid,.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric,.tile,.stat{background:linear-gradient(145deg,#FBFCFD,#F5F7F8);border:1px solid rgba(15,46,44,.05);border-radius:19px;padding:13px}.metric{min-height:84px}.metric strong,.stat strong{display:block;margin-top:9px;font-size:27px;line-height:1}.data-row{min-height:40px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}.data-row:first-child{border-top:0}.data-row span:first-child{color:var(--muted)}.data-row b{max-width:65%;text-align:right}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:10px;font-weight:800;white-space:nowrap}.progress{height:6px;border-radius:999px;background:#E7ECEA;overflow:hidden}.progress i{display:block;height:100%;background:var(--petrol);border-radius:999px}.phase-list{display:grid;gap:8px}.phase{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:67px}.phase.active{border-color:rgba(15,46,44,.18)}.phase.locked{opacity:.46;box-shadow:none}.phase-num{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:850}.phase-title{font-size:14px;font-weight:800}.phase small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}.tile{min-height:104px}.tile .ico{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:9px;font-size:16px}.tile b{font-size:13px}.tile small{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.25}.score{font-size:50px;font-weight:850;line-height:.9;letter-spacing:-2px}.stat{min-height:89px}.chart{height:95px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}.chart-col{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}.bar{width:23px;min-height:7px;border-radius:7px 7px 3px 3px;background:#BDD5CA}.bar.today{background:var(--petrol)}.chart-col small{font-size:9px;color:var(--muted)}.settings{padding:3px 17px}.setting{min-height:59px;border-top:1px solid rgba(15,46,44,.06);display:flex;align-items:center;justify-content:space-between;gap:14px}.setting:first-child{border-top:0}.setting b{font-size:13px}.setting span{font-size:13px;color:var(--muted);max-width:60%;text-align:right}.bottom-nav{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;width:min(calc(100% - 18px),396px);height:72px;border-radius:26px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.68);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 16px 42px rgba(15,46,44,.10)}.bottom-nav.hidden{display:none}.nav-item{border:0;background:transparent;border-radius:19px;color:#7B8491;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:700;white-space:nowrap;cursor:pointer}.nav-item.active{color:var(--petrol);background:rgba(15,46,44,.07)}.nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.backdrop{position:fixed;inset:0;z-index:200;display:none;background:rgba(15,23,42,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.backdrop.open{display:block}.sheet{position:fixed;left:50%;bottom:0;z-index:210;width:100%;max-width:414px;max-height:88dvh;overflow-y:auto;background:#fff;border-radius:32px 32px 0 0;padding:12px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -24px 60px rgba(0,0,0,.16);transform:translate(-50%,110%);transition:transform .32s cubic-bezier(.16,1,.3,1)}.sheet.open{transform:translate(-50%,0)}.handle{width:38px;height:4px;border-radius:999px;background:#D6D8DB;margin:0 auto 13px}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}.close{width:32px;height:32px;border:0;border-radius:50%;background:#F0F2F3;color:var(--petrol);font-size:20px;cursor:pointer}.sheet-stack{display:grid;gap:12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:#F1F3F4}.seg button{height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:750;cursor:pointer}.seg button.active{background:#fff;color:var(--petrol);box-shadow:0 2px 8px rgba(0,0,0,.06)}.trigger-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.trigger{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--petrol);font-size:12px;font-weight:800;cursor:pointer}.trigger.active{background:var(--petrol);color:#fff}.range{width:100%;accent-color:var(--petrol)}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.input{width:100%;height:49px;border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:0 13px;background:#FAFBFC;color:var(--petrol);font-size:15px;outline:none}.input:focus{background:#fff;border-color:rgba(15,46,44,.26);box-shadow:0 0 0 3px rgba(15,46,44,.06)}.onboarding{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;background:var(--bg)}.onboarding.open{display:block}.onboarding-inner{width:100%;max-width:414px;min-height:100%;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.goal{height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--petrol);font-weight:800;cursor:pointer}.goal.active{background:var(--petrol);color:#fff}.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:250;transform:translate(-50%,12px);opacity:0;background:var(--petrol);color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:360px){.view{padding-left:12px;padding-right:12px}h1{font-size:23px}.btn{font-size:14px}.bottom-nav{width:calc(100% - 10px)}}
</style>
</head>
<body>
<div class="app">
<main id="today" class="view active"></main>
<main id="lab" class="view"></main>
<main id="patterns" class="view"></main>
<main id="progress" class="view"></main>
<main id="me" class="view"></main>
</div>
<nav class="bottom-nav hidden" id="bottomNav">
<button class="nav-item active" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg><span>HEUTE</span></button>
<button class="nav-item" data-tab="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8"/></svg><span>LABOR</span></button>
<button class="nav-item" data-tab="patterns"><svg viewBox="0 0 24 24"><path d="M5 20v-5M12 20V9M19 20V4"/></svg><span>MUSTER</span></button>
<button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="m4 17 5-6 4 3 7-9M16 5h4v4"/></svg><span>FORTSCHRITT</span></button>
<button class="nav-item" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>ICH</span></button>
</nav>
<div id="backdrop" class="backdrop"></div>
<section id="sheet" class="sheet" aria-modal="true"></section>
<section id="onboarding" class="onboarding"></section>
<div id="toast" class="toast"></div>
<script>
const KEY='smokeLab.v66';
const TRIGGERS=['Stress','Kaffee','Gewohnheit','Pause','Nach dem Essen','Gesellschaft'];
const PHASES=[
{title:'Beobachten',sub:'Muster sichtbar machen',task:'Heute zwei Situationen erfassen – ohne sie bewerten zu müssen.'},
{title:'Unterbrechen',sub:'Autopilot stören',task:'Heute mindestens einmal einen Drang bewusst unterbrechen.'},
{title:'Entkoppeln',sub:'Trigger lösen',task:'Heute einen bekannten Trigger absichtlich anders beantworten.'},
{title:'Ersetzen',sub:'Neue Antworten testen',task:'Heute bewusst eine neue Antwort auf einen Trigger testen.'},
{title:'Stabilisieren',sub:'Kontrolle festigen',task:'Heute deine bisher stärkste Strategie erneut einsetzen.'}
];
const SOS={Stress:['Druck unterbrechen','Wechsle kurz den Ort und lockere Schultern und Kiefer.'],Kaffee:['Ritual trennen','Stell den Kaffee kurz weg, trink Wasser und nimm ihn an einem anderen Platz wieder auf.'],Gewohnheit:['Autopilot stören','Verändere nur einen Teil der Reihenfolge: Ort, Hand oder nächste Handlung.'],Pause:['Pause neu besetzen','Steh kurz auf und beschäftige deine Hände für einen Moment anders.'],'Nach dem Essen':['Übergang verändern','Steh direkt auf, trink Wasser und wechsel für einen Moment den Raum.'],Gesellschaft:['Sozialen Sog lösen','Bleib einen Moment sitzen oder wechsel Gespräch oder Platz und entscheide danach neu.']};
function fresh(){return{name:'',baseline:10,goal:'quit',startedAt:Date.now(),activeTab:'today',onboarded:false,events:[]}}
function load(){try{return{...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
let S=load();let logDraft={type:'smoke',trigger:'Stress',intensity:3};let sosTrigger=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function day(){return Math.max(1,Math.min(30,Math.floor((Date.now()-S.startedAt)/86400000)+1))}
function phase(){return Math.min(4,Math.floor((day()-1)/6))}
function greeting(){const h=new Date().getHours();return h<11?'Guten Morgen':h>=18?'Guten Abend':'Guten Tag'}
function today(){const k=new Date().toDateString();return S.events.filter(e=>new Date(e.ts).toDateString()===k)}
function smokes(){return today().filter(e=>e.type==='smoke').length}
function resists(){return today().filter(e=>e.type==='resist').length}
function control(){const r=S.events.slice(-20);if(!r.length)return 50;return Math.round(r.reduce((a,e)=>a+(e.type==='resist'?100:Math.max(20,80-(e.intensity||3)*10)),0)/r.length)}
function topTrigger(){if(S.events.length<8)return'Noch nicht belastbar';const c={};S.events.forEach(e=>{if(e.trigger)c[e.trigger]=(c[e.trigger]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Noch nicht belastbar'}
function averageIntensity(){if(S.events.length<8)return'Noch nicht belastbar';return(S.events.reduce((a,e)=>a+(e.intensity||3),0)/S.events.length).toFixed(1)+' / 5'}
function strongestWindow(){if(S.events.length<8)return'Noch nicht belastbar';const c={Morgen:0,Mittag:0,Nachmittag:0,Abend:0};S.events.forEach(e=>{const h=new Date(e.ts).getHours();if(h<11)c.Morgen++;else if(h<14)c.Mittag++;else if(h<18)c.Nachmittag++;else c.Abend++});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]}
function brand(){return'<div class="brand"><div class="brand-mark"><i></i><i></i><i></i><i></i></div><strong>SMOKE LAB</strong></div>'}
function render(){renderToday();renderLab();renderPatterns();renderProgress();renderMe();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===S.activeTab));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.activeTab));document.getElementById('bottomNav').classList.toggle('hidden',!S.onboarded);if(!S.onboarded)renderOnboarding();else document.getElementById('onboarding').classList.remove('open')}
function renderToday(){const p=PHASES[phase()];document.getElementById('today').innerHTML=`${brand()}<header class="head"><div class="kicker">Heute · Tag ${day()}</div><h1>${greeting()}${S.name?', '+esc(S.name):''}</h1><div class="muted">Verstehe den Trigger. Unterbrich das Muster.</div></header><section class="card hero"><div class="row"><div><div class="kicker">Phase ${phase()+1}</div><h2>${p.title}</h2><div class="muted" style="margin-top:4px">${p.sub}</div></div><div class="score-pill">${control()}/100</div></div></section><section class="actions"><button class="btn orange" data-open-log>+ Zigarette / Widerstand erfassen</button><button class="btn petrol" data-open-sos>⚡ Drang stoppen / SOS</button></section><section class="card stack"><div><div class="kicker">Tages-Radar</div><h2 style="margin-top:3px">Heute auf einen Blick</h2></div><div class="metric-grid"><article class="metric"><div class="kicker">Zigaretten</div><strong>${smokes()}</strong></article><article class="metric"><div class="kicker">Unterbrechungen</div><strong>${resists()}</strong></article></div><div><div class="data-row"><span>Muster</span><b>${esc(topTrigger())}</b></div><div class="data-row"><span>Kontrollwert</span><b>${control()}/100</b></div></div></section>`}
function renderLab(){const p=phase();document.getElementById('lab').innerHTML=`${brand()}<header class="head"><div class="kicker">Labor · 30-Tage-Programm</div><h1>Trainiere Kontrolle.</h1><div class="muted">Neue Phasen öffnen sich erst, wenn du zeitlich dort angekommen bist.</div></header><section class="card stack"><div class="row"><div><div class="kicker">Aktuelle Phase</div><h2>${PHASES[p].title}</h2></div><span class="pill">TAG ${day()}</span></div><div class="muted">${PHASES[p].task}</div><div class="progress"><i style="width:${Math.round(day()/30*100)}%"></i></div></section><section class="phase-list">${PHASES.map((x,i)=>`<article class="card phase ${i===p?'active':''} ${i>p?'locked':''}"><div class="phase-num">${i+1}</div><div><div class="phase-title">${x.title}</div><small>${i>p?'Öffnet an Tag '+(i*6+1):x.sub}</small></div><span class="pill">${i===p?'AKTIV':i>p?'GESPERRT':'ABGESCHLOSSEN'}</span></article>`).join('')}</section>`}
function tile(icon,title,text){return`<article class="tile"><div class="ico">${icon}</div><b>${esc(title)}</b><small>${esc(text)}</small></article>`}
function renderPatterns(){const n=Math.min(8,S.events.length);document.getElementById('patterns').innerHTML=`${brand()}<header class="head"><div class="kicker">Muster</div><h1>Dein Rauchmuster.</h1><div class="muted">Erst Daten sammeln, dann Muster behaupten.</div></header><section class="card stack"><div class="row"><div class="kicker">Kalibrierung</div><h2>${n}/8</h2></div><div class="progress"><i style="width:${n/8*100}%"></i></div><div class="pattern-grid">${tile('⚡','Trigger',topTrigger())}${tile('◷','Zeitfenster',strongestWindow())}${tile('▥','Intensität',averageIntensity())}${tile('◎','Kontext',S.events.length>=8?'Aus deinen Situationen':'Noch nicht belastbar')}</div></section>`}
function last7(){return[6,5,4,3,2,1,0].map(o=>{const d=new Date();d.setDate(d.getDate()-o);const k=d.toDateString();return S.events.filter(e=>new Date(e.ts).toDateString()===k).length})}
function stat(l,v){return`<article class="stat"><div class="kicker">${esc(l)}</div><strong>${v}</strong></article>`}
function renderProgress(){const vals=last7(),m=Math.max(1,...vals);document.getElementById('progress').innerHTML=`${brand()}<header class="head"><div class="kicker">Fortschritt</div><h1>Kontrolle statt Erfolgsserien.</h1><div class="muted">Mehr Wahlmöglichkeit, nicht perfekte Tage.</div></header><section class="card"><div class="row" style="align-items:flex-end"><div><div class="kicker">Kontrollwert</div><div class="score">${control()}</div><div class="muted">aus deinen letzten Situationen</div></div><span class="pill">Referenz ${S.baseline}/Tag</span></div></section><section class="stat-grid">${stat('Unterbrechungen',S.events.filter(e=>e.type==='resist').length)}${stat('Erfasst',S.events.filter(e=>e.type==='smoke').length)}${stat('Heute',smokes())}${stat('Kalibrierung',Math.min(8,S.events.length)+'/8')}</section><section class="card stack"><div class="kicker">7-Tage-Trend</div><div class="chart">${vals.map((v,i)=>`<div class="chart-col"><div class="bar ${i===6?'today':''}" style="height:${Math.max(7,Math.round(v/m*62))}px"></div><small>${i===6?'Heute':6-i+'T'}</small></div>`).join('')}</div></section>`}
function setting(a,b){return`<div class="setting"><b>${esc(a)}</b><span>${esc(b)}</span></div>`}
function renderMe(){document.getElementById('me').innerHTML=`${brand()}<header class="head"><div class="kicker">Ich</div><h1>Deine Einstellungen.</h1><div class="muted">Alles lokal auf diesem Gerät.</div></header><section class="card settings">${setting('Name',S.name||'Nicht gesetzt')}${setting('Ziel',S.goal==='quit'?'Rauchfrei werden':'Kontrolle & Reduktion')}${setting('Ausgangswert',S.baseline+' Zigaretten / Tag')}${setting('Programm','Tag '+day()+' · Phase '+(phase()+1))}</section><button class="btn white" data-edit-profile>Profil bearbeiten</button><button class="btn white danger" data-reset>App zurücksetzen</button>`}
function renderOnboarding(){const o=document.getElementById('onboarding');o.classList.add('open');o.innerHTML=`<div class="onboarding-inner">${brand()}<header class="head"><div class="kicker">Wissenschaftliches Verhaltenslabor</div><h1>Verstehe den Trigger. Unterbrich das Muster.</h1><div class="muted">Ein kurzes Setup. Deine Daten bleiben lokal auf diesem Gerät.</div></header><section class="card stack"><label class="kicker">Dein Vorname</label><input id="setupName" class="input" placeholder="Vorname" value="${esc(S.name)}"><label class="kicker">Zigaretten pro Tag</label><input id="setupBaseline" class="input" type="number" min="1" max="80" value="${S.baseline}"><label class="kicker">Dein Ziel</label><div class="goal-grid"><button class="goal ${S.goal==='quit'?'active':''}" data-goal="quit">Rauchfrei werden</button><button class="goal ${S.goal==='reduce'?'active':''}" data-goal="reduce">Kontrolle & Reduktion</button></div></section><button class="btn orange" data-start>Labor starten</button></div>`}
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML='<div class="handle"></div>'+html;document.getElementById('backdrop').classList.add('open');requestAnimationFrame(()=>s.classList.add('open'));document.body.style.overflow='hidden'}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('backdrop').classList.remove('open');document.body.style.overflowY='auto'}
function openLog(){logDraft={type:'smoke',trigger:'Stress',intensity:3};openSheet(`<div class="sheet-head"><div><div class="kicker">Erfassen</div><h2>Was ist passiert?</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><div class="seg"><button class="active" data-type="smoke">Geraucht</button><button data-type="resist">Widerstanden</button></div><div><div class="kicker" style="margin-bottom:8px">Trigger</div><div class="trigger-grid">${TRIGGERS.map((t,i)=>`<button class="trigger ${i===0?'active':''}" data-trigger="${esc(t)}">${esc(t)}</button>`).join('')}</div></div><div><div class="row"><div class="kicker">Stärke</div><b id="strengthValue">3/5</b></div><input id="strengthRange" class="range" type="range" min="1" max="5" value="3"><div class="range-labels"><span>leicht</span><span>stark</span></div></div><button class="btn orange" data-save-log>Speichern</button></div>`)}
function saveLog(){S.events.push({id:Date.now()+Math.random(),ts:Date.now(),type:logDraft.type,trigger:logDraft.trigger,intensity:Number(logDraft.intensity)});save();render();closeSheet();toast(logDraft.type==='resist'?'Unterbrechung gespeichert':'Situation gespeichert')}
function openSOS(){sosTrigger=null;openSheet(`<div class="sheet-head"><div><div class="kicker">SOS</div><h2>Was drückt gerade?</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger" data-sos="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`)}
function showSOS(t){sosTrigger=t;const x=SOS[t];openSheet(`<div class="sheet-head"><div><div class="kicker">${esc(t)}</div><h2>${esc(x[0])}</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><div class="muted" style="color:var(--petrol)">${esc(x[1])}</div></section><button class="btn petrol" data-sos-success>Drang ist gesunken</button><button class="btn white" data-close>Für jetzt schließen</button></div>`)}
function saveSOS(){S.events.push({id:Date.now()+Math.random(),ts:Date.now(),type:'resist',trigger:sosTrigger||'Unbekannt',intensity:3});save();render();closeSheet();toast('Drang unterbrochen')}
function openProfile(){openSheet(`<div class="sheet-head"><div><div class="kicker">Profil</div><h2>Daten bearbeiten</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><label class="kicker">Name</label><input id="profileName" class="input" value="${esc(S.name)}"><label class="kicker">Ausgangswert</label><input id="profileBaseline" class="input" type="number" min="1" max="80" value="${S.baseline}"><div class="kicker">Ziel</div><div class="goal-grid"><button class="goal ${S.goal==='quit'?'active':''}" data-profile-goal="quit">Rauchfrei werden</button><button class="goal ${S.goal==='reduce'?'active':''}" data-profile-goal="reduce">Kontrolle & Reduktion</button></div><button class="btn petrol" data-save-profile>Speichern</button></div>`)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1600)}
function switchTab(tab){S.activeTab=tab;save();render();window.scrollTo({top:0,left:0,behavior:'auto'})}
document.addEventListener('click',e=>{const nav=e.target.closest('.nav-item');if(nav){switchTab(nav.dataset.tab);return}if(e.target.closest('[data-open-log]')){openLog();return}if(e.target.closest('[data-open-sos]')){openSOS();return}if(e.target.closest('[data-close]')){closeSheet();return}const ty=e.target.closest('[data-type]');if(ty){logDraft.type=ty.dataset.type;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b===ty));return}const tr=e.target.closest('[data-trigger]');if(tr){logDraft.trigger=tr.dataset.trigger;document.querySelectorAll('[data-trigger]').forEach(b=>b.classList.toggle('active',b===tr));return}if(e.target.closest('[data-save-log]')){saveLog();return}const st=e.target.closest('[data-sos]');if(st){showSOS(st.dataset.sos);return}if(e.target.closest('[data-sos-success]')){saveSOS();return}const g=e.target.closest('[data-goal]');if(g){S.goal=g.dataset.goal;save();renderOnboarding();return}if(e.target.closest('[data-start]')){const n=document.getElementById('setupName').value.trim();const b=Number(document.getElementById('setupBaseline').value);S.name=n||'Daniel';S.baseline=Math.min(80,Math.max(1,b||10));S.startedAt=Date.now();S.onboarded=true;S.activeTab='today';save();render();window.scrollTo(0,0);return}if(e.target.closest('[data-edit-profile]')){openProfile();return}const pg=e.target.closest('[data-profile-goal]');if(pg){S.goal=pg.dataset.profileGoal;document.querySelectorAll('[data-profile-goal]').forEach(b=>b.classList.toggle('active',b===pg));return}if(e.target.closest('[data-save-profile]')){S.name=document.getElementById('profileName').value.trim()||S.name;S.baseline=Math.min(80,Math.max(1,Number(document.getElementById('profileBaseline').value)||10));save();closeSheet();render();toast('Profil gespeichert');return}if(e.target.closest('[data-reset]')){if(confirm('Smoke Lab wirklich zurücksetzen? Alle lokalen Daten werden gelöscht.')){localStorage.removeItem(KEY);S=fresh();render();window.scrollTo(0,0)}}});
document.addEventListener('input',e=>{if(e.target.id==='strengthRange'){logDraft.intensity=Number(e.target.value);const o=document.getElementById('strengthValue');if(o)o.textContent=logDraft.intensity+'/5'}});
document.getElementById('backdrop').addEventListener('click',closeSheet);
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
</script>
</body>
</html>
