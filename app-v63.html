<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">

<title>Smoke Lab</title>
<style>
:root{--bg:#F2F4F7;--card:#fff;--petrol:#0F2E2C;--orange:#FF7043;--text:#273642;--muted:#7A8492;--label:#8E8E93;--line:rgba(0,0,0,.04);--soft:#EEF3F1;--shadow:0 4px 20px rgba(0,0,0,.02);--r:20px;--rb:14px}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--petrol);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-y:auto}button,input{font:inherit}.app{width:100%;max-width:414px;margin:0 auto;min-height:100vh}.view{display:none;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(124px + env(safe-area-inset-bottom));grid-template-columns:minmax(0,1fr);gap:14px}.view.active{display:grid;align-content:start}.brand{display:flex;align-items:center;gap:9px;min-height:34px}.logo{width:28px;height:28px;display:grid;grid-template-columns:1fr 1fr;gap:3px}.logo i{display:block;background:var(--petrol)}.logo i:nth-child(1){border-radius:10px 3px 10px 3px}.logo i:nth-child(2){border-radius:50%;background:var(--orange)}.logo i:nth-child(3){border-radius:3px 10px 3px 10px}.logo i:nth-child(4){border-radius:10px 3px 10px 3px}.brand b{font-size:16px;letter-spacing:.2px}.head{display:grid;gap:4px}.kicker{font-size:11px;line-height:1.2;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--label)}h1,h2,p{margin:0}h1{font-size:22px;line-height:1.08;letter-spacing:-.5px;font-weight:800}h2{font-size:18px;line-height:1.15;letter-spacing:-.3px;font-weight:800}.muted{font-size:14px;line-height:1.4;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.stack{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0F2E2C,#15413D);color:#fff;min-height:118px}.hero:after{content:"";position:absolute;width:170px;height:95px;right:-30px;bottom:-45px;border-radius:55% 45% 0 0;background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,.08));transform:rotate(-7deg)}.hero h2{font-size:21px;color:#fff}.hero .kicker,.hero .muted{color:rgba(255,255,255,.68)}.score-ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) calc(var(--score)*1%),rgba(255,255,255,.14) 0);position:relative;z-index:2;flex:0 0 auto}.score-ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#17443F}.score-ring span{position:relative;z-index:1;color:#fff;font-size:11px;font-weight:800}.actions{display:grid;gap:9px}.btn{height:54px;border:0;border-radius:var(--rb);padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;white-space:nowrap;cursor:pointer;transition:transform .12s ease,opacity .12s ease}.btn:active{transform:scale(.985)}.btn.orange{background:var(--orange);color:#fff;box-shadow:0 8px 20px rgba(255,112,67,.2)}.btn.petrol{background:var(--petrol);color:#fff}.btn.white{background:#fff;color:var(--petrol);border:1px solid var(--line);box-shadow:var(--shadow)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric,.tile,.stat{background:linear-gradient(145deg,#FBFCFD,#F6F8F9);border:1px solid rgba(15,46,44,.045);border-radius:16px;padding:13px}.metric{min-height:78px}.metric strong,.stat strong{display:block;margin-top:8px;font-size:25px;line-height:1;color:var(--petrol)}.data{display:grid}.data-row{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(15,46,44,.06);font-size:13px}.data-row:first-child{border-top:0}.data-row span{color:var(--muted)}.data-row b{max-width:64%;text-align:right}.progress{height:6px;border-radius:999px;background:#E7ECEA;overflow:hidden}.progress i{display:block;height:100%;background:var(--petrol);border-radius:999px}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:27px;padding:0 9px;border-radius:999px;background:var(--soft);font-size:10px;font-weight:800;white-space:nowrap}.phase-list{display:grid;gap:8px}.phase{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:64px}.phase.locked{opacity:.48;box-shadow:none}.phase.active{border-color:rgba(15,46,44,.18)}.phase-num{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-weight:800}.phase-title{font-size:14px;font-weight:800}.phase small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.tile{min-height:96px}.tile .ico{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:8px;color:var(--petrol)}.tile b{font-size:13px}.tile small{display:block;margin-top:4px;font-size:11px;color:var(--muted);line-height:1.3}.score-big{font-size:46px;line-height:.9;letter-spacing:-1.5px;font-weight:850}.stat{min-height:84px}.chart{height:92px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}.chartcol{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}.bar{width:22px;min-height:7px;border-radius:7px 7px 3px 3px;background:#BCD4C8}.bar.today{background:var(--petrol)}.chartcol small{font-size:9px;color:var(--muted)}.settings{padding-top:2px;padding-bottom:2px}.setting{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid rgba(15,46,44,.06)}.setting:first-child{border-top:0}.setting b{font-size:13px}.setting span{font-size:13px;color:var(--muted);max-width:60%;text-align:right}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:100;width:min(100%,414px);height:calc(78px + env(safe-area-inset-bottom));padding:8px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-top:1px solid rgba(0,0,0,.04)}.nav-item{border:0;background:transparent;border-radius:14px;color:#7A8492;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:700;white-space:nowrap;cursor:pointer}.nav-item.active{color:var(--petrol);background:rgba(15,46,44,.06)}.nav-item svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.backdrop{position:fixed;inset:0;z-index:200;display:none;background:rgba(12,22,31,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.backdrop.open{display:block}.sheet{position:fixed;left:50%;bottom:0;z-index:210;width:100%;max-width:414px;max-height:88dvh;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:12px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -22px 50px rgba(0,0,0,.15);transform:translate(-50%,110%);transition:transform .32s cubic-bezier(.22,.9,.25,1)}.sheet.open{transform:translate(-50%,0)}.handle{width:38px;height:4px;border-radius:999px;background:#D6D8DB;margin:0 auto 13px}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}.close{width:32px;height:32px;border:0;border-radius:50%;background:#F0F2F3;color:var(--petrol);font-size:20px}.sheet-stack{display:grid;gap:12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#F1F3F4}.seg button{height:43px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:750}.seg button.active{background:#fff;color:var(--petrol);box-shadow:0 2px 8px rgba(0,0,0,.06)}.trigger-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.trigger{min-height:43px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--petrol);font-size:12px;font-weight:800}.trigger.active{background:var(--petrol);color:#fff}.range{width:100%;accent-color:var(--petrol)}.input{width:100%;height:47px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:#FAFBFC;color:var(--petrol);font-size:15px;outline:none}.input:focus{background:#fff;border-color:rgba(15,46,44,.24);box-shadow:0 0 0 3px rgba(15,46,44,.06)}.onboarding{position:fixed;inset:0;z-index:300;display:none;overflow-y:auto;background:var(--bg)}.onboarding.open{display:block}.onboarding-inner{width:100%;max-width:414px;min-height:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:grid;align-content:start;gap:14px}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.goal{height:47px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--petrol);font-weight:800}.goal.active{background:var(--petrol);color:#fff}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:250;transform:translate(-50%,12px);opacity:0;background:var(--petrol);color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:360px){.view{padding-left:12px;padding-right:12px}h1{font-size:21px}.btn{font-size:14px}}
</style>
</head>
<body>
<div class="app"><main id="today" class="view active"></main><main id="lab" class="view"></main><main id="patterns" class="view"></main><main id="progress" class="view"></main><main id="me" class="view"></main></div>
<nav class="bottom-nav" id="bottomNav">
<button class="nav-item active" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg><span>HEUTE</span></button>
<button class="nav-item" data-tab="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8"/></svg><span>LABOR</span></button>
<button class="nav-item" data-tab="patterns"><svg viewBox="0 0 24 24"><path d="M5 20v-5M12 20V9M19 20V4"/></svg><span>MUSTER</span></button>
<button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="m4 17 5-6 4 3 7-9M16 5h4v4"/></svg><span>FORTSCHRITT</span></button>
<button class="nav-item" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>ICH</span></button>
</nav>
<div id="backdrop" class="backdrop"></div><section id="sheet" class="sheet"></section><section id="onboarding" class="onboarding"></section><div id="toast" class="toast"></div>
<script>
const KEY='smokeLab.v61';
const TRIGGERS=['Stress','Kaffee','Gewohnheit','Pause','Nach dem Essen','Gesellschaft'];
const PHASES=[
{title:'Beobachten',sub:'Muster sichtbar machen',task:'Heute zwei Situationen erfassen – ohne sie zu bewerten.',goal:'Erkennen, wann und wodurch der Autopilot startet.',experiments:[['bewusst','Bewusste Zigarette','Eine Situation neutral beobachten und erfassen.','log'],['kaffee','Kaffee-Test','Beim nächsten Kaffee Trigger und Stärke dokumentieren.','log'],['morgen','Morning Check','Den ersten deutlichen Drang des Tages erfassen.','log']]},
{title:'Unterbrechen',sub:'Autopilot stören',task:'Heute mindestens einmal einen Drang bewusst unterbrechen.',goal:'Zwischen Trigger und Reaktion einen kleinen Entscheidungsraum schaffen.',experiments:[['delay','3-Minuten-Delay','Reaktion kurz verschieben und danach neu entscheiden.','sos'],['ort','Ort wechseln','Beim Trigger bewusst kurz den Ort wechseln.','sos'],['meal','After-Meal Reset','Nach dem Essen zuerst Wasser oder Ortswechsel.','sos']]},
{title:'Entkoppeln',sub:'Trigger lösen',task:'Heute einen bekannten Trigger absichtlich anders beantworten.',goal:'Gewohnte Auslöser Schritt für Schritt von der Zigarette trennen.',experiments:[['coffee2','Coffee Breaker','Kaffee einmal bewusst an einem anderen Ort trinken.','sos'],['hands','Hands Busy','Die Hände für einen Moment anders beschäftigen.','sos'],['break','Work-Break Test','Eine Arbeitspause ohne automatische Zigarette testen.','sos']]},
{title:'Ersetzen',sub:'Neue Antworten testen',task:'Heute bewusst eine neue Antwort auf einen Trigger testen.',goal:'Für häufige Trigger passende Alternativen aufbauen.',experiments:[['water','Wasser-Reset','Bei einem Drang zuerst Wasser holen.','sos'],['walk','Micro-Walk','Ein paar Schritte gehen und danach neu entscheiden.','sos'],['switch','Routine Switch','Einen festen Ablauf gezielt verändern.','sos']]},
{title:'Stabilisieren',sub:'Kontrolle festigen',task:'Heute deine bisher stärkste Strategie erneut einsetzen.',goal:'Die wirksamsten Unterbrechungen gezielt wiederholen.',experiments:[['best','Best Strategy','Deine bisher stärkste Unterbrechung wiederholen.','sos'],['risk','Risk Window','Ein typisches Risikofenster bewusst vorbereiten.','sos'],['choice','Conscious Choice','Vor einer Entscheidung kurz Trigger und Ziel prüfen.','log']]}
];
const SOS={Stress:['Druck unterbrechen','Lockere kurz Kiefer und Schultern. Wechsel den Ort oder geh ein paar Schritte.'],Kaffee:['Ritual trennen','Stell den Kaffee kurz weg, trink Wasser und nimm ihn an einem anderen Platz wieder auf.'],Gewohnheit:['Autopilot stören','Verändere einen Teil der Reihenfolge: Ort, Hand oder nächste Handlung.'],Pause:['Pause neu besetzen','Steh kurz auf und beschäftige deine Hände für einen Moment anders.'],'Nach dem Essen':['Übergang verändern','Steh direkt auf, trink Wasser und wechsel für einen Moment den Raum.'],Gesellschaft:['Sozialen Sog lösen','Wechsel kurz Platz oder Gespräch und entscheide danach neu.']};
function fresh(){return{name:'',baseline:10,goal:'quit',startedAt:Date.now(),activeTab:'today',onboardingCompleted:false,events:[],completedExperiments:[],activeExperiment:null}}
function load(){try{return{...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
let S=load(),draft={type:'smoke',trigger:'Stress',intensity:3},sosTrigger=null;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(){return Math.max(1,Math.min(30,Math.floor((Date.now()-S.startedAt)/86400000)+1))}
function phase(){return Math.min(4,Math.floor((day()-1)/6))}
function startDay(i){return i*6+1}
function greeting(){const h=new Date().getHours();return h<11?'Guten Morgen':h>=18?'Guten Abend':'Guten Tag'}
function todayEvents(){const k=new Date().toDateString();return S.events.filter(e=>new Date(e.timestamp).toDateString()===k)}
function smoked(){return todayEvents().filter(e=>e.type==='smoke').length}
function resisted(){return todayEvents().filter(e=>e.type==='resist').length}
function total(t){return S.events.filter(e=>e.type===t).length}
function score(){const a=S.events.slice(-20);if(!a.length)return 50;return Math.round(a.reduce((s,e)=>s+(e.type==='resist'?100:Math.max(20,80-(e.intensity||3)*10)),0)/a.length)}
function done(i){return PHASES[i].experiments.filter(x=>S.completedExperiments.includes(x[0])).length}
function topTrigger(){if(S.events.length<8)return'Noch nicht belastbar';const m={};S.events.forEach(e=>{if(e.trigger)m[e.trigger]=(m[e.trigger]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Noch nicht belastbar'}
function brand(){return'<div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div><b>SMOKE LAB</b></div>'}
function render(){renderToday();renderLab();renderPatterns();renderProgress();renderMe();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===S.activeTab));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.activeTab));if(!S.onboardingCompleted||!S.name)renderOnboarding();else document.getElementById('onboarding').classList.remove('open')}
function renderToday(){const p=phase(),P=PHASES[p],sc=score();document.getElementById('today').innerHTML=`${brand()}<header class="head"><div class="kicker">Heute · Tag ${day()}</div><h1>${greeting()}${S.name?', '+esc(S.name):''}</h1><p class="muted">Verstehe den Trigger. Unterbrich das Muster.</p></header><section class="card hero"><div class="row"><div><div class="kicker">Phase ${p+1}</div><h2>${P.title}</h2><p class="muted" style="margin-top:5px">${P.sub}</p></div><div class="score-ring" style="--score:${sc}"><span>${sc}</span></div></div></section><section class="actions"><button class="btn orange" data-open-log>+ Zigarette / Widerstand erfassen</button><button class="btn petrol" data-open-sos>Drang stoppen (SOS)</button></section><section class="card stack"><div><div class="kicker">Tages-Radar</div><h2 style="margin-top:3px">Heute auf einen Blick</h2></div><div class="grid2"><article class="metric"><div class="kicker">Zigaretten</div><strong>${smoked()}</strong></article><article class="metric"><div class="kicker">Unterbrechungen</div><strong>${resisted()}</strong></article></div><div class="data"><div class="data-row"><span>Muster</span><b>${esc(topTrigger())}</b></div><div class="data-row"><span>Labor</span><b>${done(p)}/3 Experimente</b></div></div></section>`}
function renderLab(){const p=phase(),P=PHASES[p];document.getElementById('lab').innerHTML=`${brand()}<header class="head"><div class="kicker">Labor · 30-Tage-Programm</div><h1>Trainiere Kontrolle.</h1><p class="muted">Neue Phasen öffnen sich erst, wenn du zeitlich dort angekommen bist.</p></header><section class="card stack"><div class="row"><div><div class="kicker">Aktuelle Phase</div><h2>${P.title}</h2></div><span class="pill">Tag ${day()}</span></div><p class="muted">${P.task}</p><div class="progress"><i style="width:${done(p)/3*100}%"></i></div><p class="muted">${done(p)}/3 Experimente abgeschlossen</p></section><section class="phase-list">${PHASES.map((x,i)=>`<article class="card phase ${i===p?'active':''} ${i>p?'locked':''}" ${i<=p?`data-phase="${i}"`:''}><div class="phase-num">${i+1}</div><div><div class="phase-title">${x.title}</div><small>${i>p?'Öffnet an Tag '+startDay(i):x.sub}</small></div><span class="pill">${i>p?'GESPERRT':i===p?'AKTIV':done(i)+'/3'}</span></article>`).join('')}</section>`}
function renderPatterns(){const n=S.events.length,c=Math.min(n,8);document.getElementById('patterns').innerHTML=`${brand()}<header class="head"><div class="kicker">Muster</div><h1>Dein Rauchmuster.</h1><p class="muted">Erst Daten sammeln, dann Muster behaupten.</p></header><section class="card stack"><div class="row"><div class="kicker">Kalibrierung</div><h2>${c}/8</h2></div><div class="progress"><i style="width:${c/8*100}%"></i></div><div class="grid2">${tile('⚡','Trigger',n>=8?topTrigger():'Noch nicht belastbar')}${tile('◷','Zeitfenster',n>=8?timeWindow():'Noch nicht belastbar')}${tile('▥','Intensität',n>=8?avgIntensity():'Noch nicht belastbar')}${tile('◎','Kontext',n>=8?'Aus deinen Situationen':'Noch nicht belastbar')}</div></section>`}
function tile(icon,title,text){return`<article class="tile"><div class="ico">${icon}</div><b>${title}</b><small>${esc(text)}</small></article>`}
function avgIntensity(){if(!S.events.length)return'Noch nicht belastbar';return(S.events.reduce((a,e)=>a+(e.intensity||3),0)/S.events.length).toFixed(1)+' / 5'}
function timeWindow(){const g={Morgen:0,Mittag:0,Nachmittag:0,Abend:0};S.events.forEach(e=>{const h=new Date(e.timestamp).getHours();if(h<11)g.Morgen++;else if(h<14)g.Mittag++;else if(h<18)g.Nachmittag++;else g.Abend++});return Object.entries(g).sort((a,b)=>b[1]-a[1])[0][0]}
function seven(){return[6,5,4,3,2,1,0].map(o=>{const d=new Date();d.setDate(d.getDate()-o);const k=d.toDateString();return S.events.filter(e=>new Date(e.timestamp).toDateString()===k).length})}
function renderProgress(){const vals=seven(),m=Math.max(1,...vals);document.getElementById('progress').innerHTML=`${brand()}<header class="head"><div class="kicker">Fortschritt</div><h1>Kontrolle statt Erfolgsserien.</h1><p class="muted">Mehr Wahlmöglichkeit, nicht perfekte Tage.</p></header><section class="card stack"><div class="row"><div><div class="kicker">Kontrollwert</div><div class="score-big" style="margin-top:8px">${score()}</div><p class="muted" style="margin-top:5px">aus deinen letzten Situationen</p></div><span class="pill">Referenz ${S.baseline}/Tag</span></div></section><section class="grid2"><article class="stat"><div class="kicker">Unterbrechungen</div><strong>${total('resist')}</strong></article><article class="stat"><div class="kicker">Erfasst</div><strong>${total('smoke')}</strong></article><article class="stat"><div class="kicker">Heute</div><strong>${smoked()}</strong></article><article class="stat"><div class="kicker">Labor</div><strong>${S.completedExperiments.length}</strong></article></section><section class="card stack"><div class="kicker">7-Tage-Trend</div><div class="chart">${vals.map((v,i)=>`<div class="chartcol"><div class="bar ${i===6?'today':''}" style="height:${Math.max(7,Math.round(v/m*58))}px"></div><small>${i===6?'Heute':6-i+'T'}</small></div>`).join('')}</div></section>`}
function renderMe(){document.getElementById('me').innerHTML=`${brand()}<header class="head"><div class="kicker">Ich</div><h1>Deine Einstellungen.</h1><p class="muted">Alles lokal auf diesem Gerät.</p></header><section class="card settings">${setting('Name',S.name||'Nicht gesetzt')}${setting('Ziel',S.goal==='quit'?'Aufhören':'Reduzieren')}${setting('Ausgangswert',S.baseline+' Zigaretten / Tag')}${setting('Programm','Tag '+day()+' · Phase '+(phase()+1))}</section><button class="btn white" data-edit>Profil bearbeiten</button><button class="btn white" style="color:#C54545" data-reset>App zurücksetzen</button>`}
function setting(a,b){return`<div class="setting"><b>${a}</b><span>${esc(b)}</span></div>`}
function renderOnboarding(){const o=document.getElementById('onboarding');o.classList.add('open');o.innerHTML=`<div class="onboarding-inner">${brand()}<header class="head"><div class="kicker">Smoke Lab</div><h1>Verstehe den Trigger. Unterbrich das Muster.</h1><p class="muted">Kurzes Setup – deine Daten bleiben lokal auf deinem Gerät.</p></header><section class="card stack"><label class="kicker">Dein Vorname</label><input id="obName" class="input" value="${esc(S.name)}" placeholder="Vorname"><label class="kicker">Zigaretten pro Tag</label><input id="obBase" class="input" type="number" min="1" max="80" value="${S.baseline}"><label class="kicker">Dein Ziel</label><div class="goal-grid"><button class="goal ${S.goal==='quit'?'active':''}" data-goal="quit">Aufhören</button><button class="goal ${S.goal==='reduce'?'active':''}" data-goal="reduce">Reduzieren</button></div></section><button class="btn petrol" data-start>Smoke Lab starten</button></div>`}
function openSheet(html){const s=document.getElementById('sheet'),b=document.getElementById('backdrop');s.innerHTML='<div class="handle"></div>'+html;b.classList.add('open');requestAnimationFrame(()=>s.classList.add('open'));document.body.style.overflow='hidden'}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('backdrop').classList.remove('open');document.body.style.overflowY='auto'}
function openLog(){draft={type:'smoke',trigger:'Stress',intensity:3};openSheet(`<div class="sheet-head"><div><div class="kicker">Erfassen</div><h2>Was ist passiert?</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><div class="seg"><button class="active" data-type="smoke">Geraucht</button><button data-type="resist">Widerstanden</button></div><div><div class="kicker" style="margin-bottom:7px">Trigger</div><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger ${t==='Stress'?'active':''}" data-trigger="${t}">${t}</button>`).join('')}</div></div><div><div class="row"><div class="kicker">Stärke</div><b id="ival">3/5</b></div><input id="irange" class="range" type="range" min="1" max="5" value="3"></div><button class="btn orange" data-save-log>Speichern</button></div>`)}
function openSOS(){sosTrigger=null;openSheet(`<div class="sheet-head"><div><div class="kicker">SOS</div><h2>Was drückt gerade?</h2></div><button class="close" data-close>×</button></div><div class="trigger-grid">${TRIGGERS.map(t=>`<button class="trigger" data-sos="${t}">${t}</button>`).join('')}</div>`)}
function sosStep(t){sosTrigger=t;const x=SOS[t];openSheet(`<div class="sheet-head"><div><div class="kicker">${t}</div><h2>${x[0]}</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><p class="muted" style="color:var(--text)">${x[1]}</p></section><button class="btn petrol" data-sos-done>Gesunken</button><button class="btn white" data-sos-again>Noch da</button></div>`)}
function saveEvent(type,trigger,intensity=3){S.events.push({id:Date.now()+Math.random(),timestamp:Date.now(),type,trigger,intensity});if(S.activeExperiment&&!S.completedExperiments.includes(S.activeExperiment))S.completedExperiments.push(S.activeExperiment);S.activeExperiment=null;save();render()}
function success(title,text){openSheet(`<div class="sheet-stack" style="text-align:center;padding-top:4px"><div style="width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto;font-size:22px;font-weight:900">✓</div><h2>${title}</h2><p class="muted">${text}</p><button class="btn petrol" data-close>Fertig</button></div>`)}
function phaseSheet(i){if(i>phase())return;const P=PHASES[i],current=i===phase();openSheet(`<div class="sheet-head"><div><div class="kicker">Phase ${i+1}</div><h2>${P.title}</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card stack"><div><div class="kicker">Ziel</div><p class="muted" style="margin-top:4px;color:var(--text)">${P.goal}</p></div>${current?`<div><div class="kicker">Heute</div><p class="muted" style="margin-top:4px;color:var(--text)">${P.task}</p></div>`:''}</section>${P.experiments.map(e=>`<section class="card row"><div><b style="font-size:13px">${e[1]}</b><p class="muted" style="font-size:11px;margin-top:3px">${e[2]}</p></div>${S.completedExperiments.includes(e[0])?'<span class="pill">✓</span>':current?`<button class="pill" style="border:0" data-exp="${e[0]}" data-mode="${e[3]}">Starten</button>`:'<span class="pill">offen</span>'}</section>`).join('')}</div>`)}
function editProfile(){openSheet(`<div class="sheet-head"><div><div class="kicker">Profil</div><h2>Daten bearbeiten</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><label class="kicker">Name</label><input id="pName" class="input" value="${esc(S.name)}"><label class="kicker">Ausgangswert</label><input id="pBase" class="input" type="number" min="1" max="80" value="${S.baseline}"><div class="kicker">Ziel</div><div class="goal-grid"><button class="goal ${S.goal==='quit'?'active':''}" data-pgoal="quit">Aufhören</button><button class="goal ${S.goal==='reduce'?'active':''}" data-pgoal="reduce">Reduzieren</button></div><button class="btn petrol" data-save-profile>Speichern</button></div>`)}
function switchTab(t){S.activeTab=t;save();render();window.scrollTo({top:0,left:0,behavior:'auto'})}
document.addEventListener('click',e=>{const nav=e.target.closest('.nav-item');if(nav)return switchTab(nav.dataset.tab);if(e.target.closest('[data-open-log]'))return openLog();if(e.target.closest('[data-open-sos]'))return openSOS();if(e.target.closest('[data-close]'))return closeSheet();const typ=e.target.closest('[data-type]');if(typ){draft.type=typ.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===typ));return}const tr=e.target.closest('[data-trigger]');if(tr){draft.trigger=tr.dataset.trigger;document.querySelectorAll('[data-trigger]').forEach(x=>x.classList.toggle('active',x===tr));return}if(e.target.closest('[data-save-log]')){saveEvent(draft.type,draft.trigger,draft.intensity);return success('Gespeichert','Dein Kontrollwert und deine Muster wurden aktualisiert.')}const ss=e.target.closest('[data-sos]');if(ss)return sosStep(ss.dataset.sos);if(e.target.closest('[data-sos-done]')){saveEvent('resist',sosTrigger||'Unbekannt',3);return success('Drang unterbrochen','Du hast den Autopiloten bewusst gestört.')}if(e.target.closest('[data-sos-again]'))return openSheet(`<div class="sheet-head"><div><div class="kicker">Zweiter Schritt</div><h2>Verändere den Kontext.</h2></div><button class="close" data-close>×</button></div><div class="sheet-stack"><section class="card"><p class="muted" style="color:var(--text)">Wechsel für einen Moment Ort, Körperposition oder Tätigkeit. Du musst nichts verbieten – nur den automatischen Ablauf stören.</p></section><button class="btn petrol" data-sos-done>Gesunken</button><button class="btn white" data-close>Schließen</button></div>`);const ph=e.target.closest('[data-phase]');if(ph)return phaseSheet(Number(ph.dataset.phase));const ex=e.target.closest('[data-exp]');if(ex){S.activeExperiment=ex.dataset.exp;save();return ex.dataset.mode==='sos'?openSOS():openLog()}const g=e.target.closest('[data-goal]');if(g){S.goal=g.dataset.goal;save();return renderOnboarding()}if(e.target.closest('[data-start]')){const name=document.getElementById('obName').value.trim(),base=Number(document.getElementById('obBase').value);S.name=name||'Daniel';S.baseline=Math.max(1,Math.min(80,base||10));S.startedAt=Date.now();S.onboardingCompleted=true;S.activeTab='today';save();render();return window.scrollTo(0,0)}if(e.target.closest('[data-edit]'))return editProfile();const pg=e.target.closest('[data-pgoal]');if(pg){S.goal=pg.dataset.pgoal;document.querySelectorAll('[data-pgoal]').forEach(x=>x.classList.toggle('active',x===pg));return}if(e.target.closest('[data-save-profile]')){S.name=document.getElementById('pName').value.trim()||S.name;S.baseline=Math.max(1,Math.min(80,Number(document.getElementById('pBase').value)||10));save();closeSheet();render();return toast('Profil gespeichert')}if(e.target.closest('[data-reset]')){if(confirm('Smoke Lab wirklich zurücksetzen? Alle lokal gespeicherten Daten werden gelöscht.')){localStorage.removeItem(KEY);S=fresh();render();window.scrollTo(0,0)}}});
document.addEventListener('input',e=>{if(e.target.id==='irange'){draft.intensity=Number(e.target.value);const o=document.getElementById('ival');if(o)o.textContent=draft.intensity+'/5'}});
document.getElementById('backdrop').addEventListener('click',closeSheet);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.remove('show'),1500)}
render();
</script>
</body>
</html>
