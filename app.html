0.07] bg-white/[0.025] p-4"><div class="text-[13px] font-medium text-zinc-200" x-text="microTitle"></div><div class="mt-2 text-[12px] leading-5 text-zinc-500" x-text="microCopy"></div></div><button @click="finishSOS()" class="mt-5 w-full rounded-xl bg-mintx py-3 text-[13px] font-semibold text-black active:scale-[.99]" x-text="t('urgeDown')"></button></div></div></template><template x-if="activeSheet==='history'"><div><div class="flex items-center justify-between"><h2 class="text-[22px] font-semibold tracking-[-.035em]" x-text="t('history')"></h2><button @click="closeSheet()" class="h-8 w-8 rounded-full border border-white/[0.07] bg-white/[0.03] text-zinc-500">×</button></div><div class="mt-4 space-y-2"><template x-for="e in events.slice().reverse().slice(0,40)" :key="e.id"><div class="flex items-center justify-between rounded-xl border border-white/[0.06] bg-white/[0.02] px-3 py-2.5"><div><div class="text-[12px] font-medium" x-text="eventLabel(e)"></div><div class="mt-1 text-[10px] text-zinc-600" x-text="triggerLabel(e.trigger||'habit')"></div></div><div class="font-mono text-[10px] text-zinc-600" x-text="formatTime(e.ts)"></div></div></template><div x-show="events.length===0" class="py-10 text-center text-[11px] text-zinc-600" x-text="t('noEntries')"></div></div></div></template><template x-if="activeSheet==='data'"><div><div class="flex items-center justify-between"><h2 class="text-[22px] font-semibold tracking-[-.035em]" x-text="t('data')"></h2><button @click="closeSheet()" class="h-8 w-8 rounded-full border border-white/[0.07] bg-white/[0.03] text-zinc-500">×</button></div><p class="mt-2 text-[12px] leading-5 text-zinc-500" x-text="t('dataCopy')"></p><div class="mt-5 grid grid-cols-2 gap-2"><button @click="exportData()" class="rounded-xl border border-white/[0.07] bg-white/[0.025] px-3 py-3 text-[12px] font-medium" x-text="t('export')"></button><label class="cursor-pointer rounded-xl border border-white/[0.07] bg-white/[0.025] px-3 py-3 text-center text-[12px] font-medium"><span x-text="t('import')"></span><input type="file" accept="application/json" class="hidden" @change="importData($event)"></label></div><button @click="resetAll()" class="mt-3 w-full rounded-xl border border-rose-400/15 bg-rose-400/[0.05] px-3 py-3 text-[12px] text-rose-300" x-text="t('reset')"></button></div></template></div></div>

<script>
function smokeLab(){return{key:'smoke_lab_premium_v1',lang:'de',ready:false,activeSheet:null,toast:'',breathTimer:null,profile:{name:'',mode:'reduce',baseline:10,packPrice:6.5,packSize:20,startedAt:Date.now()},events:[],capture:{type:'resisted',trigger:'stress',intensity:3},sosStep:1,sosTrigger:'stress',sosMode:null,breathRemaining:90,breathPhase:'',triggers:['stress','coffee','habit','break','afterMeal','social'],i18n:{de:{reduce:'Reduzieren',quit:'Rauchfrei',controlIndex:'Kontrollwert',phaseObserve:'Phase 1 · Beobachten',heroCopy:'Beobachten statt bewerten. Jede bewusste Entscheidung liefert ein klareres Muster.',smokeFree:'Rauchfreies Fenster',hours:'Stunden',todaySmoked:'Heute geraucht',interrupted:'Unterbrochen',saved:'Gespart',quickAction:'Quick Action',resistedAction:'Autopilot unterbrochen',resistedSub:'Bewusste Entscheidung erfassen',log:'Log',smokedAction:'Moment dokumentieren',smokedSub:'Ohne Wertung erfassen',acute:'Akut-Hilfe',sosTitle:'Drang stoppen / SOS',patternSignal:'Trigger-Signal',history:'Verlauf',noPattern:'Noch nicht belastbar',today:'Heute',patterns:'Muster',data:'Daten',setupTitle:'Verstehen vor Verändern.',setupCopy:'Lege deinen Ausgangswert fest. Keine Streaks, keine Schuld — nur bessere Daten und mehr Wahlfreiheit.',name:'Vorname',baseline:'Zigaretten/Tag',packPrice:'Packung €',start:'Labor starten',interruption:'Unterbrechung',moment:'Moment',captureTitle:'Was war der Auslöser?',trigger:'Trigger',urgeIntensity:'Drangstärke',saveMoment:'Moment speichern',sosProtocol:'SOS Urge Protocol',sosHeading:'Unterbrich den Autopiloten.',sosPickTrigger:'Welcher Trigger drückt gerade?',breathReset:'90-Sek.-Reset',microAction:'Mikro-Impuls',urgeDown:'Drang ist gesunken ✨',noEntries:'Noch keine Einträge.',dataCopy:'Alle Daten liegen lokal auf diesem Gerät. Exportiere sie als JSON oder importiere ein Backup.',export:'Exportieren',import:'Importieren',reset:'Alle Daten löschen',savedToast:'Gespeichert',imported:'Import erfolgreich',invalidFile:'Datei nich
